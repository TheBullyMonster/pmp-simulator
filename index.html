function casePanel(open=false){return `<details class="case" ${open?'open':''}><summary>Case file · Harbor Health digital access program</summary><div class="case-content"><h4>A better route to care</h4><p>Harbor Health is delivering a hospital appointment platform across urban and rural sites. A fixed privacy approval gate is due in 12 weeks; the scheduling interface is delivered incrementally. Success means reducing missed visits by 20% and platform energy use by 10%, without reducing equitable access. An AI assistant drafts appointment schedules, with final decisions subject to human approval.</p><p>Clinicians question the AI recommendations. Rural users have limited connectivity, and the sites have different workflows. The early pilot has reduced missed visits by 6%, with 45% adoption. Satisfaction is 52% at rural sites and 84% at urban sites. The sponsor wants evidence of business value before expanding the rollout.</p><p class="tiny muted">Each case question is independent. Use this common context plus any new information in that question.</p></div></details>`;}
function header(){const active=state&&state.phase!=='done';$('#header').innerHTML=`<div class="header-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">P<span class="sr-only">ractice</span></span><div><div class="brand-name">Practice Studio</div><div class="brand-sub">PMP® Exam Simulator</div></div></div><div class="header-actions"><span class="edition">2026 EDITION</span>${view!=='home'?'<button class="ghost small" data-action="home">Overview</button>':''}<button class="ghost small" data-action="guide">Exam guide</button>${active&&['home','guide'].includes(view)?'<button class="primary small" data-action="resume">Resume exam</button>':''}</div></div>${saveError?'<p class="storage-alert">Browser storage is unavailable. Your progress may be lost if you close or refresh this tab.</p>':''}`;}
function home(){const ongoing=state&&state.phase!=='done',done=state?.phase==='done';return `<div class="wrap"><div class="eyebrow">Your next chapter starts here</div><section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span> Full-length practice · July 2026 outline</div><h1>Think like a leader.<br>Prepare with purpose.</h1><p>A focused, realistic space to put your project management judgment to the test. One complete exam. Clear insights into what comes next.</p><div class="hero-bottom"><button class="primary" data-action="${ongoing?'resume':done?'results':'start'}">${ongoing?'Resume your exam':done?'View your results':'Begin practice exam'} <span aria-hidden="true">↗</span></button><span class="tiny">${ongoing?'Your exam clock continues running.':done?'Your complete review is ready.':'180 original questions. Your own pace within 4 hours.'}</span></div></div><div class="hero-graphic" aria-hidden="true"><div class="orbit"></div><div class="orbit-content"><strong>180</strong><span>DECISIONS THAT MATTER</span></div><div class="graphic-caption">People · Process · Business Environment</div></div></section><div class="stats"><div class="stat"><strong>180</strong><span>Original practice questions</span></div><div class="stat"><strong>240 <small class="tiny">min</small></strong><span>Total answering time</span></div><div class="stat"><strong>2 × 10 <small class="tiny">min</small></strong><span>Scheduled breaks</span></div><div class="stat"><strong>3</strong><span>Performance domains</span></div></div><div class="two-col"><section class="card"><div class="card-head"><h2 style="font-size:19px">Your exam journey</h2><span class="tag">3 locked sections</span></div><div class="section-row"><span class="step">01</span><div><strong>Read the situation. Make the call.</strong><small>Shared case study · Questions 1–10</small></div><span class="tiny muted">10 Qs</span></div><div class="break-row">10-minute break · Section 1 locks</div><div class="section-row"><span class="step">02</span><div><strong>Apply your project judgment.</strong><small>Independent scenarios · Questions 11–95</small></div><span class="tiny muted">85 Qs</span></div><div class="break-row">10-minute break · Section 2 locks</div><div class="section-row"><span class="step">03</span><div><strong>Finish strong. Reflect deeply.</strong><small>Independent scenarios · Questions 96–180</small></div><span class="tiny muted">85 Qs</span></div><p class="rule-note">Review every section before continuing. Correct answers and explanations unlock only after the complete exam is submitted.</p></section><section class="card"><div class="card-head"><h2 style="font-size:19px">A balanced challenge</h2><span class="tag">2026 blueprint</span></div>${[['Process',41,'#588c7f',74],['People',33,'#94b6a9',59],['Business Environment',26,'#d0b06c',47]].map(([d,p,c,n])=>`<div class="domain-row"><div><span>${d}</span><strong>${p}%</strong></div><div class="bar"><span style="width:${p}%;background:${c}"></span></div><div class="tiny muted" style="margin-top:4px">${n} questions in this practice form</div></div>`).join('')}<p class="rule-note">40% Predictive · 60% Agile / Hybrid<br>Including AI, sustainability, stakeholder engagement, and business value.</p></section></div><div class="info-strip"><span class="info-icon" aria-hidden="true">i</span><div><strong>Built for practice. Designed for focus.</strong><br>This is an independent simulation with estimated scoring. The 10 / 85 / 85 section sizes are a practice design choice; PMI specifies break placement, not these exact counts. Progress stays in this browser. The exam timer keeps running if you leave.</div></div><div class="sources">Specifications verified against the <a href="${sourceUrl}" target="_blank" rel="noopener">official PMI July 2026 content outline</a> on 13 October 2026. <button class="ghost small" data-action="guide">Read exam & scoring details →</button>${done?'<button class="ghost small" data-action="restart">Start a new attempt</button>':''}</div></div>`;}
function guide(){return `<div class="wrap guide"><div class="eyebrow">Know what to expect</div><h1 style="font-size:36px">Your exam guide</h1><p class="muted">A full-length, independent practice experience aligned to the July 2026 blueprint.</p><section class="card"><h2>Before you begin</h2><ul><li>You have <strong>240 minutes</strong> of answering time for <strong>180 questions</strong>. The clock starts only when you confirm the start.</li><li>Sections contain 10 case-study questions, then 85 and 85 independent questions. Two 10-minute breaks follow the first two sections. This is the simulator’s section sizing; PMI’s outline describes placement without exact counts.</li><li>Review unanswered and flagged questions before submitting a section. Submitting it locks its answers permanently for that attempt.</li><li>Breaks do not consume exam time. You may end a break early. After 10 minutes, the next section’s exam clock resumes automatically, including while the tab is closed.</li><li>There is no pause outside the scheduled breaks. Refreshing or closing this page does not stop the clock.</li><li>Your selections save to this browser’s local storage. Keep this tab open if a storage warning appears. Clearing browser data removes your attempt.</li><li>Single choice, multiple response, and matching items appear one at a time. Matching supports dragging or accessible dropdowns. You may leave any question unanswered.</li><li>No hints, answers, or explanations appear until the complete exam is submitted or time expires.</li></ul><h2>Practice scoring</h2><p>All 180 original items count equally. A multiple-response or matching item earns a point only when the entire response is correct. No partial credit or negative marking is applied. A partially completed matching item counts as unanswered.</p><p>The simulator uses <strong>70% overall for an estimated practice PASS</strong>. Domain labels use these local practice bands: Above Target ≥80%; Target ≥70%; Below Target ≥55%; Needs Improvement &lt;55%. Unrounded scores determine the bands.</p><p><strong>These are not PMI thresholds.</strong> PMI does not publish a simple fixed passing percentage. The official exam includes 10 unscored pretest items; this practice form scores every item to maximize feedback. Results are study indicators, not a prediction or certification.</p><h2>Blueprint & question bank</h2>${table({headers:['Domain','Blueprint proportion','This practice form'],rows:[['Process','41%','74 questions (41.11%)'],['People','33%','59 questions (32.78%)'],['Business Environment','26%','47 questions (26.11%)']]})}<p>72 items use Predictive approaches and 108 use Agile or Hybrid approaches. The report chart shows the exact blueprint proportions of 41%, 33%, and 26%. Task and approach labels appear in the post-exam review, not during testing.</p><p>Questions are original educational scenarios. They have not been psychometrically calibrated or validated by PMI, and exact official difficulty and interface equivalence are not claimed.</p><h2>Keyboard & accessibility</h2><p>Use Tab to navigate and Space to select. Radio groups support arrow keys. Alt + Right / Left moves between questions; Alt + F toggles a review flag. All drag interactions have dropdown alternatives. Browser zoom is supported.</p><h2>Sources</h2><p>Checked 13 October 2026: <a href="${sourceUrl}" target="_blank" rel="noopener">PMI July 2026 Examination Content Outline</a> and <a href="https://www.pmi.org/certifications/project-management-pmp/new-exam" target="_blank" rel="noopener">PMI’s exam update page</a>. Scope and task mapping use the current outline, including risk and change control within Business Environment.</p><button class="primary" data-action="${state?.phase==='done'?'results':state?'resume':'start'}">${state?.phase==='done'?'View report':state?'Return to exam':'Begin practice exam'} →</button></section></div>`;}
function currentRange(){return C.sections[state.section];}
function flagsInRange(){const r=currentRange();return Q.slice(r.start,r.end).filter(q=>state.flags.includes(q.id)).length;}
function answeredInRange(){const r=currentRange();return Q.slice(r.start,r.end).filter(q=>C.answered(q,state.answers[q.id])).length;}
function navButtons(full=false){const r=currentRange();return Q.slice(r.start,r.end).map((q,j)=>{const i=r.start+j,answered=C.answered(q,state.answers[q.id]),flag=state.flags.includes(q.id);if(full&&sectionFilter==='flagged'&&!flag||full&&sectionFilter==='unanswered'&&answered)return '';return `<button class="qnum ${answered?'answered':''} ${flag?'flagged':''} ${state.index===i?'current':''}" data-action="goto" data-index="${i}" aria-label="Question ${i+1}, ${answered?'answered':'unanswered'}${flag?', flagged':''}" ${state.index===i?'aria-current="step"':''}>${i+1}</button>`;}).join('');}
function sidebar(){const r=currentRange(),n=answeredInRange(),total=r.end-r.start;return `<aside class="sidebar" aria-label="Question navigator"><h3>Section ${state.section+1} of 3</h3><p class="tiny muted">${r.name}</p><div class="progress-track"><div style="width:${n/total*100}%"></div></div><div class="tiny muted">${n} of ${total} answered · ${flagsInRange()} flagged</div><div class="nav-grid">${navButtons()}</div><div class="legend-mini"><span><i class="answered"></i>Answered</span><span><i></i>Unanswered</span><span><i class="flagged"></i>Flagged</span></div><div class="section-status">${state.section?'Previous sections are locked.':'Review this section before your first break.'}</div><button class="full small" data-action="section">Review section →</button></aside>`;}
function options(q){const a=state.answers[q.id]||[];if(q.type==='matching')return `<p class="instruction">Match each situation with one response. Drag a tile onto a row, or use the dropdowns. Each response can be used once.</p><div class="drag-pool" aria-label="Responses to match">${q.options.map((o,j)=>`<span class="drag-item" draggable="true" data-drag="${j}">${esc(o)}</span>`).join('')}</div><div class="matching-prompts">${q.prompts.map((p,j)=>`<div class="match-row" data-drop="${j}"><label for="match-${j}">${esc(p)}</label><select id="match-${j}" data-match="${j}" aria-label="Response for ${esc(p)}"><option value="-1">Choose a response…</option>${q.options.map((o,k)=>`<option value="${k}" ${a[j]===k?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div>`;
return `<fieldset class="options"><legend class="instruction">${q.type==='multiple'?'Select TWO answers.':'Select ONE answer.'}</legend>${q.options.map((o,j)=>`<label class="option ${a.includes(j)?'selected':''}"><input type="${q.type==='multiple'?'checkbox':'radio'}" name="answer" value="${j}" ${a.includes(j)?'checked':''}><span class="letter">${String.fromCharCode(65+j)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset>`;}
function exam(){if(state?.phase!=='exam')return '';const q=Q[state.index],r=currentRange();return `<div class="exam-layout"><div class="exam-main"><div class="exam-top"><div><div class="eyebrow">Section ${state.section+1} · ${r.name}</div><span class="tiny muted">Question ${state.index+1} of 180</span></div><div class="timer"><small>Time remaining</small><strong id="timer">${clock(C.remaining(state))}</strong></div></div><div class="progress-track"><div style="width:${(state.index+1)/180*100}%"></div></div><article class="question-card"><div class="question-top"><span>${q.caseId?'CASE STUDY':q.type==='matching'?'MATCHING':q.type==='multiple'?'MULTIPLE RESPONSE':'SINGLE RESPONSE'} <span aria-hidden="true"> / </span> ${String(state.index+1).padStart(3,'0')}</span><button class="small ${state.flags.includes(q.id)?'active':''}" data-action="flag" aria-pressed="${state.flags.includes(q.id)}">⚑ ${state.flags.includes(q.id)?'Flagged for review':'Flag for review'}</button></div>${q.caseId?casePanel(state.index===0):''}<h1 class="question-title">${esc(q.stem)}</h1>${table(q.table)}${options(q)}<button class="ghost small" style="margin-top:8px" data-action="clear">Clear response</button><div class="question-nav"><button data-action="previous" ${state.index===r.start?'disabled':''}>← Previous</button><span class="saved"></span><div class="right"><button class="primary" data-action="${state.index===r.end-1?'section':'next'}">${state.index===r.end-1?'Review section':'Next question'} →</button></div></div></article><p class="tiny muted" style="margin:15px 4px">No feedback is shown during the exam. You can revisit any question in the current section.</p></div>${sidebar()}</div>`;}
function sectionReview(){const r=currentRange(),n=answeredInRange(),f=flagsInRange();return `<div class="wrap review-intro"><div class="exam-top"><div><div class="eyebrow">Before you continue</div><h1 style="font-size:33px;margin:0">Review section ${state.section+1}</h1></div><div class="timer"><small>Time remaining</small><strong id="timer">${clock(C.remaining(state))}</strong></div></div><p class="muted">${r.name} · Questions ${r.start+1}–${r.end}. Select a number to revisit its question.</p><div class="review-summary"><div><strong>${n}</strong><small>Answered</small></div><div><strong>${r.end-r.start-n}</strong><small>Unanswered</small></div><div><strong>${f}</strong><small>Flagged for review</small></div></div><div class="review-toolbar">${[['all','All questions'],['unanswered','Unanswered'],['flagged','Flagged']].map(([v,t])=>`<button class="small pill ${sectionFilter===v?'active':''}" aria-pressed="${sectionFilter===v}" data-action="sectionFilter" data-value="${v}">${t}</button>`).join('')}</div><div class="section-review-grid">${navButtons(true)||'<p class="muted">No questions match this filter.</p>'}</div><div class="legend-mini"><span><i class="answered"></i>Answered</span><span><i></i>Unanswered</span><span><i class="flagged"></i>Flagged</span></div><div class="notice">${state.section===2?'Submitting finishes your entire exam and unlocks your performance report and detailed review.':'Continuing locks this section. You will not be able to change these answers after starting the break.'} ${r.end-r.start-n?'Unanswered questions receive no credit.':''}</div><div class="question-nav"><button data-action="resume">← Back to question</button><button class="primary" data-action="submitSection">${state.section===2?'Submit complete exam':'Submit section & take break'} →</button></div></div>`;}
function breakView(){return `<div class="wrap"><section class="card break-screen"><div class="break-symbol" aria-hidden="true">◷</div><div class="eyebrow">Break ${state.section} of 2</div><h1 style="font-size:35px">A moment to reset.</h1><p class="muted">Section ${state.section} is submitted and locked.<br>Your exam clock is paused during this break.</p><div class="break-time" id="break-timer">${clock(state.breakEnd-Date.now())}</div><p class="tiny muted">Next: ${C.sections[state.section].name}<br>Questions ${C.sections[state.section].start+1}–${C.sections[state.section].end} · ${clock(state.remaining)} of exam time remaining</p><button class="primary" data-action="endBreak">End break & continue →</button><p class="tiny muted" style="margin:20px 0 0">The next section starts automatically when this countdown ends.<br>The clock continues even if this tab is closed.</p></section></div>`;}

function pie(){const order=[['Process',41],['People',33],['Business Environment',26]];let angle=-Math.PI/2;const arcs=order.map(([d,p])=>{const x=190+100*Math.cos(angle),y=135+100*Math.sin(angle);angle+=p/100*2*Math.PI;const x2=190+100*Math.cos(angle),y2=135+100*Math.sin(angle);return `<path d="M190 135 L${x} ${y} A100 100 0 0 1 ${x2} ${y2} Z" fill="${colors[report.domains[d].level]}" stroke="white" stroke-width="1.4"><title>${d}: ${p}% of blueprint, ${report.domains[d].level}</title></path>`;}).join('');return `<svg class="chart" viewBox="0 0 390 280" role="img" aria-label="Exam domain proportions: Process 41 percent, People 33 percent, Business Environment 26 percent. Slice colors represent domain performance.">${arcs}<path d="M286 98 L315 72 L356 72 M179 237 L165 262 L115 262 M99 75 L73 42 L31 42" fill="none" stroke="#8e9f96" stroke-width="1.4"/><text x="305" y="58" font-size="11" fill="#263e34">Process 41%</text><text x="88" y="276" font-size="11" fill="#263e34">People 33%</text><text x="8" y="22" font-size="10" fill="#263e34">Business Environment 26%</text></svg>`;}
function reportView(){const entries=Object.entries(report.domains).sort((a,b)=>b[1].percent-a[1].percent),max=entries[0][1].percent,min=entries.at(-1)[1].percent,weak=Object.entries(report.topics).filter(([,v])=>v.percent<80).sort((a,b)=>a[1].percent-b[1].percent||b[1].total-a[1].total).slice(0,6);return `<div class="wrap"><div class="page-title"><div><div class="eyebrow">Your practice performance</div><h1>Every attempt is progress.</h1></div><button data-action="review">Review answers →</button></div><section class="report"><div class="report-logo">PMP<sup>®</sup></div><p class="report-date">Date of practice exam: ${new Date(state.completedAt).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p><div class="report-performance">Overall Performance: <strong class="${report.pass?'':'fail'}">${report.pass?'PASS':'FAIL'}</strong></div><p class="eyebrow" style="margin:13px 0;color:#58776a">Estimated practice result</p><p class="tiny muted">${state.expired?'Time expired and your exam was automatically submitted.':'Your complete practice exam has been submitted.'}<br>Independent practice estimate. Not a PMI exam result or certification.</p><div class="report-score"><strong>${report.percent.toFixed(1)}%</strong><div><strong>Overall practice score</strong><p>${report.correct} correct · ${report.incorrect} incorrect · ${report.unanswered} unanswered</p></div></div><hr class="report-divider"><h2>Exam Breakdown</h2><p class="muted">Domain proportion and performance by target level.</p><div class="report-legend">${Object.entries(colors).map(([l,c])=>`<span><i class="swatch" style="background:${c}"></i>${l}</span>`).join('')}</div><div class="chart-layout">${pie()}<div>${['Process','People','Business Environment'].map(d=>{const r=report.domains[d];return `<div class="domain-result"><div><strong>${d}</strong><span>${r.correct} / ${r.total} correct · ${r.percent.toFixed(1)}%</span></div><div><i class="swatch" style="background:${colors[r.level]}"></i><span>${r.level}</span></div></div>`;}).join('')}</div></div><p class="tiny muted">Slice sizes show the exact blueprint proportions, not your accuracy. Colors show your estimated domain performance.</p><div class="notice">Practice PASS: ≥70% overall. Domain bands: ≥80% Above Target, ≥70% Target, ≥55% Below Target, &lt;55% Needs Improvement. These are simulator rules, not PMI’s official thresholds. All 180 practice questions are scored equally.</div><div class="report-actions"><button class="primary" data-action="review">Explore detailed review →</button><button data-action="print">Print report</button><button data-action="export">Download results</button><button class="ghost" data-action="restart">New attempt</button></div></section><div class="result-insights"><section class="card"><div class="eyebrow">Where to focus next</div><h2 style="font-size:21px">Your study priorities</h2>${weak.length?weak.map(([t,v],i)=>`<div class="priority"><strong>${i+1}. ${esc(t)}</strong><span>${esc(v.domain)} · ${v.correct}/${v.total} correct</span><p class="tiny muted" style="margin:5px 0 0">Review missed items in this topic, explain why the alternatives are weaker, then practice a new scenario before retesting.</p></div>`).join(''):'<p class="muted">Every topic is at or above 80%. Review the decisions you flagged and revisit the reasoning behind any missed items.</p>'}</section><section class="card"><div class="eyebrow">Patterns in your performance</div><h2 style="font-size:21px">Strengths & next steps</h2><div class="priority"><strong>Strongest ${entries.filter(([,r])=>r.percent===max).length>1?'domains (tie)':'domain'}</strong><span>${entries.filter(([,r])=>r.percent===max).map(([d])=>d).join(', ')} · ${max.toFixed(1)}%</span></div><div class="priority"><strong>Weakest ${entries.filter(([,r])=>r.percent===min).length>1?'domains (tie)':'domain'}</strong><span>${entries.filter(([,r])=>r.percent===min).map(([d])=>d).join(', ')} · ${min.toFixed(1)}%</span></div><div class="priority"><strong>Flagged for review · ${state.flags.length}</strong><span>${state.flags.length?Q.map((q,i)=>state.flags.includes(q.id)?i+1:null).filter(Boolean).join(', '):'No questions were flagged.'}</span><br><button class="ghost small" data-action="flaggedReview">Review flagged questions →</button></div><div class="priority"><strong>Build the reasoning, not just recall.</strong><span>For missed questions, identify the decision, constraints, and the action that should come first. Review the relevant task in the official outline.</span></div></section></div></div>`;}
function filteredReview(){return Q.map((q,i)=>({q,i,result:report.items[i]})).filter(({q,result})=>(reviewDomain==='all'||q.domain===reviewDomain)&&(reviewFilter==='all'||reviewFilter==='flagged'&&state.flags.includes(q.id)||reviewFilter==='incorrect'&&!result.ok&&!result.blank||reviewFilter==='unanswered'&&result.blank||reviewFilter==='correct'&&result.ok));}
function reviewView(){const list=filteredReview();reviewIndex=Math.min(reviewIndex,Math.max(0,list.length-1));const item=list[reviewIndex];return `<div class="wrap guide" style="max-width:1040px"><div class="page-title"><div><div class="eyebrow">Understand your decisions</div><h1>Detailed answer review</h1></div><button data-action="results">Back to report</button></div><div class="review-toolbar"><label class="tiny" for="review-status">Show</label><select id="review-status">${[['all','All questions'],['incorrect','Incorrect'],['unanswered','Unanswered'],['flagged','Flagged'],['correct','Correct']].map(([v,t])=>`<option value="${v}" ${reviewFilter===v?'selected':''}>${t}</option>`).join('')}</select><label class="tiny" for="review-domain">Domain</label><select id="review-domain">${['all','People','Process','Business Environment'].map(d=>`<option value="${d}" ${reviewDomain===d?'selected':''}>${d==='all'?'All domains':d}</option>`).join('')}</select><span class="tiny muted">${list.length} questions</span></div>${item?reviewQuestion(item):'<div class="card empty">No questions match these filters.</div>'}${item?`<div class="question-nav"><button data-action="reviewPrev" ${reviewIndex===0?'disabled':''}>← Previous</button><label class="tiny">Review item <select id="review-jump" aria-label="Jump to review question">${list.map((x,i)=>`<option value="${i}" ${i===reviewIndex?'selected':''}>Question ${x.i+1}</option>`).join('')}</select></label><button class="primary" data-action="reviewNext" ${reviewIndex===list.length-1?'disabled':''}>Next →</button></div>`:''}</div>`;}
function reviewQuestion({q,i,result}){const k=answerKeys[q.id],a=state.answers[q.id]||[];return `<article class="review-item"><div class="review-meta">Question ${i+1} of 180 · ${esc(q.domain)} · Task ${q.task}: ${esc(tasks[q.domain][q.task-1])} · ${esc(q.approach)}<br>Topic: ${esc(q.topic)} ${state.flags.includes(q.id)?' · ⚑ Flagged during exam':''}</div><p><span class="status-chip ${result.ok?'':'wrong'}">${result.ok?'CORRECT':result.blank?'UNANSWERED':'INCORRECT'}</span></p>${q.caseId?casePanel():''}<h3>${esc(q.stem)}</h3>${table(q.table)}${q.type==='matching'?q.prompts.map((p,j)=>`<div class="review-option ${a[j]===k.correct[j]?'correct':'wrong'}"><strong>${esc(p)}</strong><p>Your response: ${a[j]>=0?esc(q.options[a[j]]):'Unanswered'}</p><p><strong>Correct match: ${esc(q.options[k.correct[j]])}</strong></p><p>${esc(k.rationales[j])}</p></div>`).join(''):q.options.map((o,j)=>`<div class="review-option ${k.correct.includes(j)?'correct':a.includes(j)?'wrong':''}"><strong>${String.fromCharCode(65+j)}. ${esc(o)}</strong> ${a.includes(j)?'<span class="status-chip">Your choice</span>':''} ${k.correct.includes(j)?'<span class="status-chip">Correct answer</span>':''}<p>${esc(k.rationales[j])}</p></div>`).join('')}<div class="mindset"><strong>PMP mindset / decision logic</strong><br>${esc(k.mindset)}</div></article>`;}
async function showResults(target='results'){if(state?.phase!=='done')return;view='loading';render();try{await loadKeys();report=C.score(Q,state,answerKeys);view=target;render();focusMain();}catch(e){view='error';header();$('#main').innerHTML=`<div class="wrap card"><h1 style="font-size:28px">Your attempt is saved.</h1><p>${esc(e.message)}</p><button data-action="results">Retry loading report</button></div>`;}}
function render(){header();if(!Q.length){$('#main').innerHTML='<div class="wrap card"><h1>Question bank could not load.</h1><p>Refresh the page or check that all app files are present.</p></div>';return;}const html=view==='home'?home():view==='guide'?guide():view==='exam'?exam():view==='section'?sectionReview():view==='break'?breakView():view==='results'?reportView():view==='review'?reviewView():'<div class="wrap"><p>Preparing your performance report…</p></div>';$('#main').innerHTML=html;updateSave();}
function modal(title,body,label,action){dialogAction=action;$('#dialog').innerHTML=`<h2 id="dialog-title">${esc(title)}</h2><p>${body}</p><div class="dialog-actions"><button data-action="cancelDialog">Cancel</button><button class="primary" data-action="confirmDialog">${esc(label)}</button></div>`;$('#dialog').showModal();$('#dialog button').focus();}
function go(i){C.reconcile(state);if(state.phase==='done'){save();showResults();return;}if(C.canVisit(state,i)){state.index=i;view='exam';save();render();focusMain();}}
function start(){modal('Ready to begin?','Your 240-minute exam clock will start. It continues if you leave or close this page. Answers save in this browser. Feedback unlocks after final submission.','Start exam',()=>{state=C.fresh();save();view='exam';render();focusMain();});}
function resume(){if(!state)return;C.reconcile(state);save();if(state.phase==='done')return showResults();view=state.phase==='break'?'break':'exam';render();focusMain();}
function setMatch(row,value){const q=Q[state.index];const a=[...(state.answers[q.id]||Array(q.prompts.length).fill(-1))];if(value>=0){const existing=a.indexOf(value);if(existing!==-1&&existing!==row)a[existing]=-1;}a[row]=value;state.answers[q.id]=a;save();document.querySelectorAll('[data-match]').forEach(s=>s.value=String(a[+s.dataset.match]));refreshSidebar();}
function refreshSidebar(){const aside=$('.sidebar');if(aside)aside.outerHTML=sidebar();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
  if(action==='cancelDialog'){$('#dialog').close();dialogAction=null;return;}if(action==='confirmDialog'){const f=dialogAction;dialogAction=null;$('#dialog').close();f?.();return;}
  if(action==='home'){view='home';render();focusMain();return;}if(action==='guide'){view='guide';render();focusMain();return;}if(action==='start'){start();return;}if(action==='resume'){resume();return;}if(action==='results'){showResults();return;}
  if(action==='restart'){modal('Start a new attempt?','This replaces the saved attempt and its results. Download your results first if you want to keep them. The new exam begins immediately with a fresh 240-minute clock.','Start new attempt',()=>{state=C.fresh();report=null;reviewIndex=0;save();view='exam';render();focusMain();});return;}
  if(action==='review'||action==='flaggedReview'){reviewFilter=action==='flaggedReview'?'flagged':'all';reviewDomain='all';reviewIndex=0;showResults('review');return;}
  if(action==='print'){window.print();return;}if(action==='export'&&state?.phase==='done'){const output={title:'PMP Practice Studio — estimated practice result',completedAt:new Date(state.completedAt).toISOString(),scoring:'All 180 equally weighted; exact match; practice PASS at 70%, not an official PMI threshold.',summary:report,responses:Q.map((q,i)=>({number:i+1,id:q.id,domain:q.domain,task:q.task,topic:q.topic,approach:q.approach,question:q.stem,prompts:q.prompts,options:q.options,selected:state.answers[q.id]||[],...answerKeys[q.id],flagged:state.flags.includes(q.id)}))};const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='pmp-practice-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
  if(action==='reviewPrev'||action==='reviewNext'){reviewIndex+=action==='reviewPrev'?-1:1;render();focusMain();return;}
  if(!state)return;C.reconcile(state);if(state.phase==='done'&&!['results','review'].includes(view)){save();showResults();return;}
  if(action==='endBreak'){C.endBreak(state);save();view=state.phase==='done'?'results':'exam';if(state.phase==='done')showResults();else{render();focusMain();}return;}
  if(state.phase!=='exam')return;
  if(action==='goto'){go(+b.dataset.index);return;}if(action==='previous'||action==='next'){go(state.index+(action==='next'?1:-1));return;}
  if(action==='flag'){const id=Q[state.index].id;state.flags=state.flags.includes(id)?state.flags.filter(x=>x!==id):[...state.flags,id];save();const flag=state.flags.includes(id);b.classList.toggle('active',flag);b.setAttribute('aria-pressed',String(flag));b.textContent=flag?'⚑ Flagged for review':'⚑ Flag for review';refreshSidebar();speak(flag?'Question flagged for review':'Flag removed');return;}
  if(action==='clear'){delete state.answers[Q[state.index].id];save();render();speak('Response cleared');return;}
  if(action==='section'){view='section';sectionFilter='all';render();focusMain();return;}
  if(action==='sectionFilter'){sectionFilter=b.dataset.value;render();return;}
  if(action==='submitSection'){const r=currentRange(),unanswered=r.end-r.start-answeredInRange();modal(state.section===2?'Submit your complete exam?':'Lock this section?',`This section has <strong>${unanswered} unanswered</strong> and <strong>${flagsInRange()} flagged</strong> questions. ${state.section===2?'All responses will be finalized and your detailed results will unlock.':'You cannot return to these questions after continuing. Your 10-minute break starts next.'}`,state.section===2?'Submit exam':'Lock section & start break',()=>{C.finishSection(state);save();if(state.phase==='done')showResults();else{view='break';render();focusMain();}});}
});
document.addEventListener('change',e=>{
  if(e.target.id==='review-status'){reviewFilter=e.target.value;reviewIndex=0;render();return;}if(e.target.id==='review-domain'){reviewDomain=e.target.value;reviewIndex=0;render();return;}if(e.target.id==='review-jump'){reviewIndex=+e.target.value;render();return;}
  if(state?.phase!=='exam'||view!=='exam')return;C.reconcile(state);if(state.phase==='done'){save();showResults();return;}
  const q=Q[state.index];if(e.target.name==='answer'){let a=state.answers[q.id]||[],v=+e.target.value;if(q.type==='single')a=[v];else{a=e.target.checked?[...a,v]:a.filter(x=>x!==v);if(a.length>2){e.target.checked=false;speak('Select at most two answers. Deselect one to change your response.');return;}}state.answers[q.id]=a;save();document.querySelectorAll('.option').forEach(l=>l.classList.toggle('selected',l.querySelector('input').checked));refreshSidebar();}
  if(e.target.matches('[data-match]'))setMatch(+e.target.dataset.match,+e.target.value);
});
document.addEventListener('dragstart',e=>{if(e.target.dataset.drag!==undefined)e.dataTransfer.setData('text/plain',e.target.dataset.drag);});
document.addEventListener('dragover',e=>{const row=e.target.closest('[data-drop]');if(row){e.preventDefault();row.classList.add('dragover');}});
document.addEventListener('dragleave',e=>e.target.closest('[data-drop]')?.classList.remove('dragover'));
document.addEventListener('drop',e=>{const row=e.target.closest('[data-drop]');if(!row||state?.phase!=='exam'||view!=='exam')return;e.preventDefault();row.classList.remove('dragover');C.reconcile(state);if(state.phase==='done'){save();showResults();return;}const raw=e.dataTransfer.getData('text/plain'),v=Number(raw);if(raw!==''&&Number.isInteger(v)&&v>=0&&v<Q[state.index].options.length){setMatch(+row.dataset.drop,v);speak('Match selected');}});
document.addEventListener('keydown',e=>{if(!e.altKey||view!=='exam'||$('#dialog').open)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.index+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.index-1);}if(e.key.toLowerCase()==='f'){e.preventDefault();$('[data-action="flag"]')?.click();}});
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const other=JSON.parse(e.newValue);if(other.version!==1)return;state=C.reconcile(other);if(state.phase==='done')showResults();else{view=state.phase==='break'?'break':'exam';render();speak('Progress updated from another tab.');}}catch{}});
setInterval(()=>{if(!state||state.phase==='done')return;const before=state.phase;C.reconcile(state);if(before!==state.phase){$('#dialog').close();dialogAction=null;save();if(state.phase==='done'){speak('Time expired. Your exam has been submitted.');showResults();}else{view='exam';render();speak('Your break has ended. The exam clock has resumed.');}return;}const timer=$('#timer');if(timer){const ms=C.remaining(state);timer.textContent=clock(ms);timer.parentElement.classList.toggle('low',ms<15*60*1000);if(Math.ceil(ms/1000)===15*60)speak('Fifteen minutes remain.');}const br=$('#break-timer');if(br)br.textContent=clock(state.breakEnd-Date.now());},250);
if(state?.phase==='done'){save();showResults();}else if(state){view=state.phase==='break'?'break':'home';render();}else render();

</script>
</body>
</html>
