 baseline using the corporate reduction percentage before evaluating effects on cost-saving benefits."]},{"task":5,"topic":"Working agreements","approach":"Agile","stem":"A team has recurring disagreements about response times, meeting attendance, and when to ask for help. Members work different hours and have never explicitly agreed on collaboration norms. Which TWO actions should the project manager facilitate to align team expectations? Select TWO.","options":["Have the team create practical working agreements reflecting actual constraints.","Adopt another team's rules unchanged to establish consistency quickly.","Review agreements periodically using evidence from collaboration problems.","Ask each member to set private collaboration rules for their work."],"id":"PE48","domain":"People","type":"multiple"},{"id":"PR25","domain":"Process","task":10,"topic":"Administrative closure","approach":"Predictive","type":"single","stem":"A sponsor terminates a predictive research project after a portfolio decision. Two prototypes are complete, supplier orders remain open, and the team assumes closure activities no longer matter because the final product will not be delivered. What should the project manager do NEXT?","options":["Perform tailored closure covering accepted work, contracts, records, and lessons.","Keep executing the original plan until every planned deliverable is complete.","Mark all unfinished deliverables as accepted to reconcile the project records.","Release everyone immediately and let procurement discover outstanding orders."]},{"task":3,"topic":"Inclusive leadership","approach":"Agile","stem":"A remote team member produces strong work but speaks little in rapid video discussions. The team interprets this as disengagement, yet her written suggestions often reveal important edge cases. What should the project manager do to help the team use her contribution effectively?","options":["Require her to speak first at every meeting to build confidence.","Have another member summarize her ideas without changing meeting practices.","Combine written preparation and facilitated discussion to include different participation styles.","Assign her independent tasks that do not require group decisions."],"id":"PE58","domain":"People","type":"single"},{"task":2,"topic":"Cultural misunderstanding","approach":"Hybrid","stem":"A multinational team interprets a colleague's silence as agreement, but she later raises major concerns privately. Others accuse her of withholding objections. She explains that challenging senior colleagues publicly is uncomfortable. What should the project manager do to improve collaboration?","options":["Tell her public debate is required by the existing meeting culture.","Establish inclusive ways to raise concerns and confirm agreement explicitly with everyone.","Ask a senior colleague to speak on her behalf in all meetings.","Treat silence as agreement but allow concerns before written approval."],"id":"PE37","domain":"People","type":"single"},{"id":"PR73","domain":"Process","task":8,"topic":"Aging work","approach":"Agile","type":"single","stem":"An agile service team has stable average throughput, but one high-priority request has remained in progress for four times the typical cycle time. The dashboard averages still look healthy, and the request is needed for an upcoming launch. What should the project manager help the team do FIRST?","options":["Increase the throughput target so the team completes more unrelated requests.","Reset the request's start date to match the current reporting period.","Wait for average cycle time to deteriorate before taking any action.","Inspect the aging request's blockage and dependencies before relying on aggregate averages."]},{"id":"PR32","domain":"Process","task":6,"topic":"Financial measures","approach":"Predictive","type":"matching","stem":"At a cost review, a new analyst confuses four earned-value measures and prepares contradictory conclusions. The project manager asks the analyst to associate each question with the correct measure before interpreting the data. Match each management question to the MOST appropriate measure.","options":["Cost performance index (EV/AC)","Estimate to complete","Cost variance (EV−AC)","Estimate at completion"],"prompts":["What is the monetary cost difference for work already performed?","How efficiently has money produced earned value?","What is the forecast total project cost?","How much is the remaining work expected to cost?"]},{"id":"PR67","domain":"Process","task":1,"topic":"Sustainability planning","approach":"Agile","type":"single","stem":"An agile team is developing a cloud reporting service. The sponsor has added a measurable energy-efficiency objective to the approved product direction, but the backlog and delivery plan contain no measurement work. What should the project manager help the team do NEXT?","options":["Wait until deployment and estimate savings from the cloud provider's marketing materials.","Treat the objective as automatically achieved because the service is digital.","Add a sustainability label to the release report without changing planned work.","Integrate baseline collection, measurable criteria, and verification work into the delivery plan."]},{"id":"BE37","domain":"Business Environment","task":8,"topic":"Technology obsolescence","approach":"Agile","type":"single","stem":"A cloud vendor announces that an interface used by the team's product will be retired in nine months. The current roadmap contains features customers requested, and a replacement interface is available with migration guidance. What should the product team do FIRST with the project manager's support?","options":["Stop all feature delivery until every component has been moved to the replacement interface.","Assess affected capabilities, migration effort, risks, and timing so the roadmap can be reprioritized deliberately.","Wait until the retirement month because the interface remains supported during the announced notice period.","Ask customers to choose between migration and all planned features without first estimating either option."]},{"id":"BE20","domain":"Business Environment","task":2,"topic":"Compliance traceability","approach":"Predictive","type":"single","stem":"A transport project must demonstrate that each mandatory accessibility requirement is satisfied before service opens. Several design teams produce separate verification reports, making it difficult to identify missing evidence. What should the project manager establish FIRST to make compliance assurance reliable?","options":["A consolidated mapping from each applicable requirement to its accountable owner, verification method, and evidence.","A central dashboard comparing each design team's verification completion rate and unresolved document count.","An independent sample audit of the available reports, prioritizing the design areas with the largest budgets.","A common verification report template and weekly approval meeting attended by all design-team leads."]},{"task":3,"topic":"Motivation and support","approach":"Predictive","stem":"An experienced estimator who normally contributes actively has become quiet and missed two reviews. The project manager knows the department recently reorganized but has no direct explanation for the behavior. What is the most appropriate first action to support performance?","options":["Reassign the estimator's responsibilities until commitment improves.","Ask the department head whether disciplinary action has begun.","Remind the full team that attendance is required for delivery.","Have a private conversation to understand concerns and agree needed support."],"id":"PE20","domain":"People","type":"single"},{"id":"PR47","domain":"Process","task":2,"topic":"Vertical slicing","approach":"Agile","type":"single","stem":"A team proposes a first iteration containing only database tables, a second containing only services, and a third containing all user screens. Stakeholders need early feedback on whether submitting a service request is understandable. Which scope decomposition BEST supports that need?","options":["A thin end-to-end request-submission slice with testable user acceptance criteria.","A complete database schema covering every expected future request type.","All screen mockups without a working submission path or feedback activity.","A list of infrastructure tasks ranked only by technical convenience."]},{"task":6,"topic":"Priority disappointment","approach":"Agile","stem":"A stakeholder's requested reporting feature has been deferred twice because higher-value compliance work emerged. The stakeholder now says the team ignores her department. The product owner has a documented prioritization rationale. What should the project manager do to help manage the relationship?","options":["Promise inclusion next iteration to rebuild the stakeholder's confidence.","Send the backlog link and explain the product owner's responsibility.","Move the feature ahead of compliance work to demonstrate responsiveness.","Discuss the unmet need, explain trade-offs, and agree future decision communication."],"id":"PE55","domain":"People","type":"single"},{"id":"BE32","domain":"Business Environment","task":3,"topic":"Change routing","approach":"Hybrid","type":"matching","stem":"A hybrid program delegates routine backlog ordering to its product owner, reserves baseline funding changes for an investment board, and uses a designated security incident lead for active threats. Match each situation to the correct initial decision route under this agreed governance model.","prompts":["A proposed capability requires funding beyond the approved baseline.","Two unstarted backlog items exchange order without affecting approved constraints.","An active credential compromise requires immediate containment using the incident procedure."],"options":["Use the security incident authority","Use the investment change authority","Use delegated product prioritization"]},{"task":8,"topic":"Communication accessibility","approach":"Predictive","stem":"A global facility project distributes detailed weekly reports in the headquarters language. Regional supervisors sign acknowledgments, yet crews repeatedly follow outdated instructions. Interviews indicate that several supervisors struggle with the reports' technical terminology. What should the project manager do first?","options":["Increase report frequency so supervisors encounter the instructions more often.","Require supervisors to confirm that every attachment has been downloaded.","Work with supervisors to adapt language and format and verify understanding.","Escalate repeated noncompliance to regional management before changing communications."],"id":"PE11","domain":"People","type":"single"},{"id":"BE33","domain":"Business Environment","task":2,"topic":"Accessibility in delivery","approach":"Agile","type":"single","stem":"An agile team demonstrates a public-service portal that meets most usability goals. Keyboard-only users cannot complete one critical transaction, contrary to the project's mandatory accessibility criteria. The product owner wants to release and fix the gap next month. What is the BEST response?","options":["Release because the defect affects a small user segment and the overall usability score is strong.","Treat the unmet mandatory criterion as a release constraint and collaborate on a compliant release option.","Remove keyboard users from the target audience so the portal satisfies its revised acceptance scope.","Ask the team to classify the defect as cosmetic to avoid delaying the planned release milestone."]},{"task":5,"topic":"Hybrid cadence expectations","approach":"Hybrid","stem":"A hardware team works to approved phase gates while a software team releases increments every two weeks. Business stakeholders expect each software demonstration to mean the integrated device is ready. The schedules are technically compatible, but misunderstanding persists. What should the manager facilitate?","options":["Stop software demonstrations until hardware completes all phases.","Ask stakeholders to infer readiness from the integrated schedule.","Agree milestone definitions distinguishing component feedback from integrated release acceptance.","Replace hardware phase gates with iteration dates without further analysis."],"id":"PE54","domain":"People","type":"single"},{"id":"BE04","domain":"Business Environment","task":1,"topic":"Governance thresholds","approach":"Predictive","type":"single","stem":"A facilities project is within its approved cost baseline but forecasts a six-week delay that exceeds the steering committee's tolerance. The sponsor asks the project manager to resolve it informally because no additional funding is needed. What is the BEST response?","options":["Keep the issue within the team until a recovery action also affects the cost baseline.","Invoke the agreed escalation threshold and present recovery options with business and schedule impacts.","Ask the contractor to revise its forecast so the report reflects the contractual completion date.","Request immediate project closure because a governance tolerance has already been exceeded."]},{"task":1,"topic":"Value-based trade-offs","approach":"Hybrid","stem":"A public-service project aims to improve access for residents. A team proposes removing a low-bandwidth option because most pilot users prefer a richer interface. Community representatives note that residents with unreliable connectivity were underrepresented in the pilot. What should the project manager do first?","options":["Approve simplification because it reflects the majority of collected feedback.","Preserve every original feature regardless of implementation cost.","Defer the choice to the technical lead as an interface detail.","Revisit the access objective and examine representative evidence before deciding."],"id":"PE59","domain":"People","type":"single"},{"id":"BE38","domain":"Business Environment","task":5,"topic":"Opportunity response","approach":"Hybrid","type":"single","stem":"A hybrid energy project learns that combining two planned pilot installations could qualify for a research partnership that funds independent performance analysis. Eligibility is uncertain, and the application deadline is three weeks away. What should the project manager do NEXT to manage this opportunity?","options":["Ignore the partnership because risk management addresses threats to approved delivery commitments.","Commit to combining the installations immediately because external funding always improves project value.","Add the expected funding to the baseline before eligibility is confirmed so reporting reflects the opportunity.","Assess eligibility, expected value, and delivery impacts, then assign an owner and response deadline."]},{"id":"PR09","domain":"Process","task":8,"topic":"Critical path","approach":"Predictive","type":"single","stem":"A predictive rollout has two parallel paths after kickoff. All durations are in working days, no activities share constrained resources, and completion requires both paths to finish. The sponsor asks which activity can slip two days without delaying completion. Which answer is correct?","options":["Activity C can slip because its duration is longer.","Activity D can slip because it occurs near completion.","Neither path contains any schedule flexibility.","Activity A can slip because its path is shorter."],"table":{"headers":["Activity","Predecessor","Duration"],"rows":[["A","None","4"],["B","A","4"],["C","None","6"],["D","C","4"]]}},{"id":"PR38","domain":"Process","task":7,"topic":"Definition of done","approach":"Agile","type":"multiple","stem":"An agile team calls stories complete after coding, but security tests and accessibility checks accumulate for a later hardening phase. Releases routinely fail the organization's agreed quality expectations. What should the project manager help the team do? Select TWO.","options":["Transfer responsibility for quality entirely to the final release committee.","Include applicable security and accessibility evidence in the definition of done.","Build required checks into the delivery workflow and available capacity.","Count partially tested stories as done to stabilize historical velocity."]},{"id":"BE42","domain":"Business Environment","task":4,"topic":"Safe containment and resolution","approach":"Agile","type":"single","stem":"After a small release, a team discovers that some users can view another customer's order summary. The team can disable the affected function immediately, while investigating the cause will take longer. The established incident process identifies a security lead. What should the project manager facilitate FIRST?","options":["Wait for root-cause confirmation so the team does not interrupt a function unnecessarily.","Activate the incident process and coordinate immediate containment with the designated security authority.","Add a high-priority backlog item and address it during the next normal iteration planning session.","Ask the product owner to decide whether the exposure is acceptable based on customer complaint volume."]},{"id":"BE17","domain":"Business Environment","task":8,"topic":"Market viability","approach":"Predictive","type":"single","stem":"Halfway through development of a new consumer device, a competitor releases a lower-priced product with equivalent core functions. The project's technical milestones remain achievable, but projected revenue depends on the original price premium. What should the project manager do FIRST?","options":["Direct engineering to add premium features immediately to restore the planned competitive advantage.","Continue the approved plan because competitor behavior is outside the project's controllable scope.","Announce that the project has failed because the original revenue forecast is no longer certain.","Work with business owners to assess market effects on expected value and identify decision options."]},{"id":"BE05","domain":"Business Environment","task":2,"topic":"Regulatory evidence","approach":"Predictive","type":"single","stem":"Before commissioning a water treatment installation, the team discovers that the supplier's test certificate covers a previous equipment revision. Physical inspections have found no defects, and replacement evidence will take several days. What should the project manager do NEXT to protect compliance?","options":["Accept the inspection results as equivalent evidence and obtain the updated certificate after commissioning.","Ask the sponsor to acknowledge the missing certificate and authorize unrestricted commissioning.","Remove the equipment from the approved scope so the existing compliance package can be submitted.","Assess the evidence gap with the compliance owner and hold the affected approval until required proof is verified."]},{"id":"PR11","domain":"Process","task":6,"topic":"Financial reserve governance","approach":"Predictive","type":"single","stem":"A construction project has an approved contingency amount for a documented groundwater treatment response. The identified condition occurs, and the response fits the original estimate. The project manager has delegated authority to use this contingency but not management reserve. What is the BEST action?","options":["Charge the cost to an unrelated work package with an underspend.","Use the authorized contingency and update forecasts and financial records.","Request management reserve because every unexpected expenditure requires it.","Reduce the performance baseline silently to offset the treatment cost."]},{"id":"PR59","domain":"Process","task":9,"topic":"Dashboard transparency","approach":"Agile","type":"multiple","stem":"An agile dashboard shows only completed stories. It omits an aging blocked item that threatens the planned customer trial and excludes unresolved acceptance work. The project manager wants the next review to support sound delivery decisions. What should be included? Select TWO.","options":["Only the average velocity so the sponsor receives a consistent single metric.","The blocked item's age, dependency, accountable owner, and effect on the trial forecast.","Remaining acceptance work and a forecast based on complete delivery criteria.","A higher completion percentage based on coding effort already spent."]},{"task":3,"topic":"Psychological safety","approach":"Predictive","stem":"At a bridge-design review, a junior analyst privately tells the project manager that a calculation assumption may be wrong. She hesitated during the meeting because a senior engineer dismisses basic questions. The design is not yet approved. What should the manager do?","options":["Ask the analyst to obtain a second opinion before raising the concern.","Create a safe technical review of the concern and address dismissive meeting behavior.","Submit the current design while documenting the analyst's reservation for later review.","Tell the analyst to challenge the senior engineer publicly at the next meeting."],"id":"PE14","domain":"People","type":"single"},{"task":7,"topic":"Lessons applied","approach":"Predictive","stem":"A team discovers that an earlier project documented the same procurement-interface issue now delaying its work. The lessons repository is complete but rarely consulted, and project kickoff training did not cover relevant lessons. What should the project manager do to improve knowledge use?","options":["Require all staff to read the entire repository before continuing work.","Integrate relevant lessons into current planning and assign follow-up actions.","Add the current issue to the repository after project closure.","Ask the PMO to create a larger repository with more categories."],"id":"PE24","domain":"People","type":"single"},{"task":8,"topic":"Distributed communication","approach":"Agile","stem":"A distributed team resolves design questions in a live meeting attended mostly by one time zone. Members elsewhere discover decisions after starting incompatible work. Meeting attendance cannot be increased without regular overnight participation. What is the most effective communication improvement?","options":["Require all members to attend until the release is complete.","Ask absent members to review recordings before beginning any work.","Let each time zone make independent decisions for its components.","Use a visible decision record and asynchronous input window for consequential choices."],"id":"PE35","domain":"People","type":"single"},{"id":"PR41","domain":"Process","task":9,"topic":"Agile progress evidence","approach":"Agile","type":"single","stem":"An agile team reports high velocity for three iterations, yet users cannot complete the end-to-end registration flow because integration work remains unfinished. A sponsor asks whether the release is ready. Which evidence should the project manager prioritize in the response?","options":["A demonstration of usable integrated capability against release acceptance criteria.","The percentage of developers who have completed their assigned coding tasks.","The cumulative number of backlog items created since project initiation.","The number of story points completed relative to another team."]},{"id":"PR53","domain":"Process","task":6,"topic":"Funding runway","approach":"Hybrid","type":"single","stem":"A hybrid product team has $180,000 of authorized funding remaining. Its stable fully loaded cost is $30,000 for each two-week iteration, and there are no other planned costs. The sponsor asks for the remaining funded delivery horizon. Which answer is correct?","options":["Three iterations, equivalent to six weeks.","Six iterations, equivalent to twelve weeks.","Nine iterations, equivalent to eighteen weeks.","Twelve iterations, equivalent to twenty-four weeks."],"table":{"headers":["Financial input","Value"],"rows":[["Authorized funds remaining","$180,000"],["Cost per iteration","$30,000"],["Iteration length","2 weeks"]]}},{"id":"BE36","domain":"Business Environment","task":7,"topic":"Benefits ownership","approach":"Hybrid","type":"single","stem":"A customer-service automation project will close shortly after launch, but its expected benefit is a six-month reduction in resolution time. Operations assumes the project team will track the benefit, while the project sponsor assumes operations already owns it. What should the project manager do NEXT?","options":["Extend the entire project by six months without approval so someone continues tracking the outcome.","Record the projected benefit as realized when the launch deliverables pass technical acceptance.","Agree a named operational benefit owner, measurement baseline, review cadence, and escalation path before transition.","Remove the benefit from closure documentation because it cannot be measured before the project ends."]},{"id":"BE27","domain":"Business Environment","task":6,"topic":"Experiment success criteria","approach":"Agile","type":"single","stem":"An online service team believes that a shorter onboarding flow will improve activation. Stakeholders disagree about whether success means more sign-ups, fewer support calls, or faster first use. The team can run a limited experiment next iteration. What should it do FIRST?","options":["Build the shortest possible flow and choose whichever metric improves most after the experiment.","Agree an outcome hypothesis, primary measure, and guardrails before testing the proposed flow.","Ask the highest-ranking stakeholder to select a metric after reviewing the experiment results.","Include every requested onboarding feature so all stakeholder definitions of success are equally satisfied."]},{"task":7,"topic":"Knowledge transfer methods","approach":"Hybrid","type":"matching","stem":"A hybrid implementation team is planning knowledge transfer across operational and delivery roles. Different gaps require different techniques, and recipients need to use the knowledge independently after handover. Match each gap to the transfer method that most directly addresses it.","prompts":["Support analysts have manuals but cannot diagnose intermittent incidents.","A new team cannot understand why an unusual architecture was chosen.","Regional trainers must show they can teach a changed workflow."],"options":["Have recipients teach the workflow back using realistic examples.","Run paired diagnosis exercises with an experienced operator.","Review the decision record, alternatives, and relevant trade-offs."],"id":"PE34","domain":"People"},{"id":"BE39","domain":"Business Environment","task":1,"topic":"Independent assurance","approach":"Hybrid","type":"single","stem":"A project developing a clinical decision-support tool has a governance rule requiring independent validation before patient-facing deployment. The sponsor suggests that the development lead sign the validation because an external reviewer is unavailable this week. What is the project manager's BEST response?","options":["Identify a qualified independent validation option and present the timing impact through the agreed governance route.","Accept the development lead's signature because that person understands the implementation more deeply than others.","Deploy only to a few patients and classify the activity as research so the validation rule does not apply.","Remove validation from the current release checklist and restore it once an external reviewer becomes available."]},{"id":"PR07","domain":"Process","task":3,"topic":"Incremental value","approach":"Predictive","type":"single","stem":"A municipal records project plans to digitize six archives and release everything at year end. One archive is already validated, contains the most frequently requested records, and can operate independently. The agreed project scope permits phased handover. What should the project manager do NEXT?","options":["Increase the remaining archives' budgets using the assumed savings.","Release the validated archive immediately without checking support readiness.","Keep all archives unavailable until the final project closure review.","Evaluate an early handover with operations and confirm benefit measurement."]},{"id":"PR52","domain":"Process","task":9,"topic":"Artifact tailoring","approach":"Hybrid","type":"single","stem":"A hybrid program requires auditable approval evidence, while its delivery teams use digital backlogs and automated test records. A proposed reporting process asks teams to retype every item into a separate spreadsheet weekly. What should the project manager do FIRST?","options":["Implement duplicate entry because more documents always improve governance.","Eliminate approval evidence because the teams already follow agile practices.","Let each team invent a different approval record without common traceability.","Map required evidence to existing records and identify only genuine reporting gaps."]},{"id":"BE46","domain":"Business Environment","task":5,"topic":"Risk acceptance authority","approach":"Agile","type":"single","stem":"A team proposes releasing a feature with a known recovery weakness because the likelihood of failure appears low. Its estimated business impact exceeds the product owner's delegated risk tolerance. A tested fallback is possible but would delay release by one iteration. What is the BEST action?","options":["Allow the product owner to accept the risk because all backlog and release decisions belong to that role.","Release without recording the weakness because the estimated likelihood is below the team's concern threshold.","Present the residual exposure and fallback option to the authorized risk decision maker before release.","Cancel the feature permanently because any risk above team tolerance makes it unacceptable to the organization."]},{"id":"BE25","domain":"Business Environment","task":4,"topic":"Recurring impediment","approach":"Agile","type":"single","stem":"A development team loses two days each iteration waiting for access to a shared test environment. The project manager has repeatedly expedited individual tickets, but delays recur. The infrastructure group is willing to collaborate on a solution. What is the BEST next action?","options":["Map the recurring access bottleneck with both teams and agree a sustainable service or automation improvement.","Continue expediting tickets because each iteration ultimately completes most of its planned work.","Increase every estimate by two days and accept the access wait as unavoidable delivery effort.","Escalate directly to the chief executive before discussing process changes with the infrastructure group."]},{"task":7,"topic":"Cross-training","approach":"Predictive","stem":"Only one planner understands the logic in a complex shutdown schedule. Her vacation overlaps the readiness review, and other team members can open the file but cannot explain key dependencies. Which approach most effectively reduces this single-person dependency before the review?","options":["Move the review to a date when the planner can attend remotely.","Pair another planner with her to update and explain representative schedule paths.","Ask her to export all schedule activities into a larger reference document.","Have her remain available by telephone for decisions throughout her vacation."],"id":"PE18","domain":"People","type":"single"},{"id":"PR08","domain":"Process","task":4,"topic":"Resource availability","approach":"Predictive","type":"multiple","stem":"A laboratory construction project needs a certified commissioning engineer for three consecutive weeks. The named engineer is also assigned to an operational outage, and the resource calendar did not reflect that commitment. What should the project manager do NEXT? Select TWO.","options":["Evaluate qualified alternatives and resequence dependent work where feasible.","Approve overtime before checking whether the engineer can legally perform both roles.","Confirm actual availability and required qualifications with the resource owner.","Add the engineer to both schedules and resolve conflicts during commissioning."]},{"task":4,"topic":"Engagement feedback loop","approach":"Agile","stem":"Customers attend demonstrations but rarely provide feedback. The product owner interprets this as satisfaction, while a follow-up interview reveals they do not know which decisions remain open. What should the project manager help the team change at the next demonstration?","options":["Shorten demonstrations and measure success through attendance alone.","Frame specific questions and show how feedback affects upcoming decisions.","Require customers to submit detailed written evaluations before leaving.","Stop requesting feedback until customers voluntarily identify a problem."],"id":"PE53","domain":"People","type":"single"},{"task":7,"topic":"Knowledge transfer readiness","approach":"Predictive","stem":"A commissioning expert will leave in three weeks. The operations team has received equipment manuals but has never diagnosed the intermittent faults the expert routinely handles. Project closure is scheduled shortly afterward. Which TWO actions best strengthen the handover? Select TWO.","options":["Ask operations to acknowledge receipt of the manuals as evidence of readiness.","Arrange paired troubleshooting sessions using representative fault scenarios.","Retain the expert's email address as the main source of post-project support.","Have operations demonstrate the diagnostic steps and capture unresolved knowledge gaps."],"id":"PE10","domain":"People","type":"multiple"},{"task":8,"topic":"Sensitive communication","approach":"Hybrid","stem":"A project manager learns that a proposed organizational change may affect several roles, but leadership has not finalized the decision. Team rumors are growing and reducing concentration. The manager is authorized to discuss the decision process but not individual staffing outcomes. What should the manager do?","options":["Assure everyone that their roles are safe to restore focus.","Avoid discussion until every staffing decision is final.","Share speculative scenarios privately with trusted members.","Explain known facts, acknowledge uncertainty, and state when updates will arrive."],"id":"PE51","domain":"People","type":"single"},{"id":"PR51","domain":"Process","task":4,"topic":"Cross-functional capacity","approach":"Agile","type":"single","stem":"An agile team depends on one database specialist for nearly every story. That specialist is fully occupied while other team members wait, and hiring is unavailable this quarter. What should the project manager facilitate to improve sustainable delivery capacity?","options":["More simultaneous stories so every team member has an assigned task.","A rule that the specialist works evenings whenever the queue grows.","Removal of database acceptance checks to make specialist work faster.","Pairing and targeted skill development around the constrained work."]},{"id":"PR65","domain":"Process","task":3,"topic":"Experiment measurement","approach":"Agile","type":"single","stem":"An agile team proposes a faster checkout to increase completed purchases. The first experiment reports faster screen response but no measure of purchase completion. The product owner wants to scale the feature based on the technical improvement. What should the project manager recommend NEXT?","options":["Use developer satisfaction as the sole measure of checkout success.","Measure the intended purchase outcome using an agreed baseline and appropriate comparison.","Scale immediately because lower latency always increases purchases.","Replace the original objective with response time because that result is available."]},{"task":2,"topic":"Vendor-team disagreement","approach":"Predictive","stem":"The customer testing lead and supplier lead blame each other for repeated test failures. Each has separate logs, and neither has reviewed the other's evidence. The contract includes escalation procedures, but working-level resolution has not been attempted. What should the project manager do first?","options":["Invoke the contractual dispute procedure to protect the customer's position.","Accept the customer lead's findings because the customer owns acceptance.","Ask both parties to submit revised statements for the project records.","Facilitate joint evidence review and agree a shared problem statement."],"id":"PE26","domain":"People","type":"single"},{"id":"PR66","domain":"Process","task":10,"topic":"Partial project closure","approach":"Hybrid","type":"single","stem":"A hybrid program ends one workstream after handing over an accepted reporting capability, while two other workstreams continue. The reporting supplier asks for final acceptance and the team is being reassigned. What is the BEST way to handle this transition?","options":["Release the reporting team and assume the continuing teams will handle its obligations.","Require all program benefits to be realized before accepting the reporting capability.","Close the workstream with documented acceptance, support ownership, records, and contract disposition.","Postpone every closure activity until the entire program ends."]},{"id":"PR36","domain":"Process","task":3,"topic":"Value-based prioritization","approach":"Agile","type":"single","stem":"An agile team has one iteration before an operational trial. All candidate items satisfy mandatory requirements, use the same capacity estimate method, and have no dependencies. The product owner wants the highest stated expected benefit per unit of effort as a first-pass ranking. Which item should rank first?","options":["Item B.","Item C.","Item D.","Item A."],"table":{"headers":["Item","Expected benefit units","Effort points"],"rows":[["A","40","8"],["B","30","5"],["C","28","4"],["D","18","3"]]}},{"task":4,"topic":"Stakeholder fatigue","approach":"Hybrid","stem":"Business specialists attend several overlapping project workshops each week and have begun declining invitations. Their missing input now delays decisions. The project manager learns that different teams are requesting the same information in different formats. What should the project manager do next?","options":["Escalate declining attendance to the specialists' functional managers.","Require written responses for each missed workshop within one day.","Accept available input and treat silence as approval on remaining topics.","Coordinate engagement across teams and consolidate requests around clear decisions."],"id":"PE39","domain":"People","type":"single"},{"id":"PR57","domain":"Process","task":7,"topic":"Trustworthy automated quality evidence","approach":"Agile","type":"single","stem":"An agile team's automated integration tests alternate between passing and failing on identical builds. Developers suspect an unstable test environment, but a recent genuine regression produced a similar failure. Repeated reruns are delaying delivery, and the product owner proposes removing the affected checks from the release gate. What should the project manager facilitate FIRST?","options":["Temporarily remove the intermittent checks and rely on the unaffected automated tests for release approval.","Increase automatic retries and approve a build whenever one complete rerun produces a passing result.","Replace the integration gate with developer review until the next iteration can address test stability.","Examine failure traces and environment conditions to distinguish test instability from defects before revising the controls."]},{"id":"BE45","domain":"Business Environment","task":8,"topic":"Supply-chain ethical change","approach":"Hybrid","type":"single","stem":"Credible new information indicates that a proposed hardware supplier may not meet the organization's responsible-sourcing policy. Procurement has not signed the contract, and alternatives would affect delivery timing. What should the project manager do FIRST while supporting an evidence-based business decision?","options":["Work with procurement and the policy owner to verify the concern and assess compliant sourcing alternatives.","Sign the contract quickly because obligations discovered after signing can be transferred to the supplier.","Publish an accusation against the supplier so the project is seen to defend organizational values.","Ignore the information because the supplier offered the lowest cost during the approved selection process."]},{"id":"PR12","domain":"Process","task":7,"topic":"Quality assurance","approach":"Predictive","type":"single","stem":"A manufacturer repeatedly finds the same calibration defect during final inspection. The team repairs each unit and still meets the delivery date, but rework cost is rising. The project manager wants to reduce recurrence without relaxing specifications. What should happen NEXT?","options":["Ask the customer to approve a wider calibration tolerance immediately.","Increase final inspection sampling while keeping the production process unchanged.","Analyze the calibration process and implement a verified preventive correction.","Accept repaired units as evidence that the quality process is effective."]},{"id":"PR60","domain":"Process","task":5,"topic":"Make-or-buy analysis","approach":"Hybrid","type":"single","stem":"A hybrid project needs a data-conversion utility for one migration. An internal team can build it, while a vendor offers a reusable service with support and usage charges. The sponsor asks which option is cheaper, but internal estimates omit maintenance and the vendor quote omits data cleanup. What should happen FIRST?","options":["Negotiate the vendor price before deciding which work the service includes.","Compare complete delivery alternatives using equivalent scope and total relevant cost.","Choose the internal build because staff salaries are already budgeted.","Choose the vendor because reuse necessarily makes external services cheaper."]},{"id":"PR48","domain":"Process","task":5,"topic":"Supplier outcome review","approach":"Hybrid","type":"multiple","stem":"A hybrid project pays a vendor for successive integration increments. The latest invoice cites all planned labor hours, but two interface acceptance tests have failed and documentation is incomplete. What should the project manager do NEXT? Select TWO.","options":["Compare the delivered increment with the contractual acceptance and payment terms.","Work with procurement and the vendor on documented corrective actions and obligations.","Approve acceptance solely because the planned labor hours have been consumed.","Withhold every payment across unrelated contracts without consulting procurement."]},{"id":"PR50","domain":"Process","task":8,"topic":"Flow measures","approach":"Hybrid","type":"matching","stem":"A hybrid service program tracks requests on a workflow board, but reports use several flow terms interchangeably. The project manager wants to clarify the measures before using them for planning. Match each observation with the MOST appropriate flow measure.","options":["Throughput","Lead time","Work in progress","Cycle time"],"prompts":["Elapsed time from request arrival until delivery.","Elapsed time from starting active work until delivery.","Number of requests delivered in one week.","Number of requests started but not yet finished."]},{"id":"BE16","domain":"Business Environment","task":4,"topic":"Escalation of cross-project blocker","approach":"Predictive","type":"single","stem":"An enterprise rollout cannot complete testing because another project controls a shared laboratory. The two project managers have explored schedule swaps, but both milestones are contractually constrained. No mutually feasible option remains within their authority. What should the project manager do NEXT?","options":["Escalate the dependency conflict with options and consequences to the designated portfolio decision authority.","Book the laboratory without agreement because the rollout has already approved its testing baseline.","Continue negotiating indefinitely because escalation would demonstrate inadequate stakeholder management.","Remove testing from the rollout schedule so the external dependency no longer affects its critical path."]},{"id":"BE13","domain":"Business Environment","task":2,"topic":"Supplier AI data compliance","approach":"Predictive","type":"single","stem":"A contractor proposes using an AI service to classify archived customer records during a migration. The service reduces effort, but its standard terms permit retaining submitted data for model improvement. The project has approved data-handling restrictions. What is the BEST next action?","options":["Allow use because the contractor, rather than the project organization, operates the AI service.","Review the proposed data flow and terms with authorized privacy and security specialists before approving use.","Permit use after removing customer names because de-identification always removes privacy obligations.","Reject all AI services permanently so the project never needs to assess third-party data controls."]},{"id":"PR24","domain":"Process","task":9,"topic":"Forecast integrity","approach":"Predictive","type":"single","stem":"An engineering manager submits a progress report showing design as 95% complete for a third consecutive month. Several required review comments remain unresolved, and completion has no objective measurement rule. What should the project manager do FIRST to improve the status assessment?","options":["Accept the estimate because the engineering manager is the technical expert.","Set the percentage to zero until every review comment is resolved.","Replace the reported percentage with the elapsed share of the design duration.","Agree objective completion rules and assess remaining work against them."]},{"task":1,"topic":"Vision under competing priorities","approach":"Predictive","stem":"A water-treatment construction project has an approved charter, but engineering emphasizes capacity while operations emphasizes maintenance simplicity. Both departments believe their interpretation reflects the sponsor's intent. Detailed design begins next week. What should the project manager do first to establish a common direction?","options":["Let engineering lead because detailed design is the next scheduled phase.","Ask the sponsor to choose one department's position before design starts.","Preserve the charter wording and resolve disagreements during design reviews.","Connect the charter's benefits to agreed design success criteria in a facilitated discussion."],"id":"PE04","domain":"People","type":"single"},{"task":4,"topic":"Overlooked stakeholder","approach":"Predictive","stem":"During a warehouse expansion, a nearby school raises concerns about delivery traffic. The school was absent from the stakeholder register because construction remains within the company's property. The traffic plan has not yet been approved. What should the project manager do first?","options":["Refer the school to public authorities because it is outside project governance.","Continue approval and include the concern in the next community newsletter.","Assess the school's interests and influence and engage it in the traffic discussion.","Ask the contractor to stop planning until the school provides formal requirements."],"id":"PE07","domain":"People","type":"single"},{"task":6,"topic":"Expectations for experimentation","approach":"Agile","stem":"An agile team is testing a new customer onboarding sequence with a small, consented user group. A regional manager tells staff the experimental sequence will become mandatory next month, although no adoption decision has been made. What should the project manager do next?","options":["Ask the team to retain the sequence so the manager's announcement remains credible.","End the experiment because the announcement has compromised its original purpose.","Clarify the experiment's decision criteria and possible outcomes with the manager and affected staff.","Wait for test results before correcting expectations to avoid sending another update."],"id":"PE33","domain":"People","type":"single"},{"id":"BE19","domain":"Business Environment","task":7,"topic":"Change saturation","approach":"Predictive","type":"single","stem":"A finance transformation is ready to train users, but the same departments are already adopting two other enterprise changes. Managers report that staff cannot absorb another mandatory program this month. The project has flexibility within its transition window. What is the BEST response?","options":["Send the materials by email and record all recipients as trained to preserve the current milestone.","Insist on the original schedule because the transformation was approved before managers raised concerns.","Coordinate with organizational change owners to sequence adoption and protect essential role-based learning.","Delay the entire project until every other organizational initiative has finished its implementation."]},{"id":"BE07","domain":"Business Environment","task":4,"topic":"Issue ownership","approach":"Predictive","type":"single","stem":"A delayed utility connection now prevents testing a new factory line. The risk had been identified, but its response owner has left the organization. Two functional managers each insist the other department should act. What is the project manager's BEST immediate action?","options":["Wait for the functional managers to agree because the project manager cannot assign operational work.","Increase the probability score in the risk register and review it at the next monthly meeting.","Record the realized issue, secure an accountable owner, and coordinate a time-bound resolution or escalation.","Charge the delay to management reserve and continue reporting the original testing milestone unchanged."]},{"task":5,"topic":"Negotiating constraints","approach":"Predictive","stem":"A museum director expects all exhibition areas to remain open during renovation. The facilities lead explains that one area must close for safety, and the approved plan allows phased closure. Which TWO actions should the project manager take to align expectations? Select TWO.","options":["Explore visitor-service priorities and clarify the nonnegotiable safety constraint.","Commit to uninterrupted access and ask the contractor to devise a workaround.","Collaborate on phased access options and record agreement with authorized stakeholders.","Delay discussion until the contractor submits the first closure notice."],"id":"PE21","domain":"People","type":"multiple"},{"id":"BE12","domain":"Business Environment","task":1,"topic":"Benefit-based stage gate","approach":"Predictive","type":"single","stem":"A regional distribution center is on schedule and within budget. At its investment gate, updated demand forecasts show that expected utilization has fallen substantially. The delivery team recommends proceeding because most design work is complete. Which recommendation BEST supports effective project governance?","options":["Approve the next construction stage conditionally and require the commercial team to restore the original demand forecast.","Commission a second demand study and defer the gate discussion while planned construction commitments continue.","Reassess continuing business justification and present continuation, redesign, and stopping options to the gate authority.","Request a smaller cost baseline from the delivery team and use the resulting savings to justify continuation."]},{"task":2,"topic":"Resource conflict","approach":"Predictive","stem":"Two discipline leads need the same testing specialist during a critical commissioning week. Each cites a contractual milestone, and their exchanges have become personal. The resource manager can provide only the originally committed capacity. What should the project manager do next?","options":["Bring the leads together to examine dependencies and negotiate a feasible allocation.","Assign the specialist to the discipline with the larger contract value.","Split the specialist's time equally to demonstrate impartial treatment.","Ask the resource manager to arbitrate before discussing schedule alternatives."],"id":"PE05","domain":"People","type":"single"},{"task":1,"topic":"Purpose through change","approach":"Predictive","stem":"A sponsor proposes replacing a project benefit about faster customer service with a narrow target for installed terminals. Team leads welcome the simpler measure, although some terminals may never be used. What should the project manager do before supporting the proposed change?","options":["Check whether the proposed measure still demonstrates the intended business outcome.","Accept the target because physical deliverables are easier to verify.","Ask procurement to increase terminal quantities to improve reported success.","Keep the original benefit confidential to avoid confusing delivery teams."],"id":"PE13","domain":"People","type":"single"},{"task":2,"topic":"Healthy disagreement","approach":"Agile","stem":"Two senior developers propose different architectures. Both options meet current requirements, and discussion has continued across several planning sessions without new evidence. The team can test the most uncertain assumptions in a short experiment. What should the project manager facilitate?","options":["Ask the more senior developer to choose to end the delay.","Agree evaluation criteria and a timeboxed experiment that informs a team decision.","Let both architectures proceed in parallel through the next release.","Escalate to the sponsor because technical disagreement indicates team dysfunction."],"id":"PE45","domain":"People","type":"single"},{"id":"PR20","domain":"Process","task":8,"topic":"Schedule compression","approach":"Predictive","type":"single","stem":"A predictive project must recover five days after a completed activity overran. Two upcoming activities are sequential only because of a preferred working method; partial overlap is technically possible but could cause rework. Additional staffing would not shorten either activity. What should the project manager assess NEXT?","options":["Whether crashing both activities will eliminate the delay at no extra cost.","Whether the original completion date can be retained without changing the forecast.","Whether all remaining quality checks can be moved after customer acceptance.","Whether fast tracking the activities is feasible and its rework exposure is acceptable."]},{"id":"PR64","domain":"Process","task":6,"topic":"Forecast versus baseline","approach":"Hybrid","type":"single","stem":"A hybrid project forecasts a cost overrun after a detailed estimate of the remaining integration work. The financial dashboard still shows the approved budget, and a manager proposes replacing it with the forecast so variance disappears. What should the project manager do?","options":["Preserve the approved reference, show the current forecast, and follow financial governance for any baseline decision.","Replace the approved budget because the forecast is more recent information.","Suppress the forecast until the sponsor authorizes additional funding.","Move the extra integration cost outside the project to preserve reported performance."]},{"task":3,"topic":"Developing leadership opportunities","approach":"Agile","stem":"A high-performing agile team member wants experience facilitating stakeholder workshops, but the same confident colleague always volunteers first. Both are capable, and no role assignment requires a permanent facilitator. What should the project manager do to support development without disrupting the next workshop?","options":["Let the frequent volunteer continue because stakeholder familiarity takes precedence over development.","Assign the aspiring facilitator sole responsibility without discussing preparation or support.","Discuss development goals and arrange a supported facilitation opportunity with feedback afterward.","Ask the aspiring facilitator to attend external training before allowing any workshop participation."],"id":"PE46","domain":"People","type":"single"},{"task":5,"topic":"Decision rights","approach":"Hybrid","stem":"A product owner and a governance board both believe they can approve changes to a regulated workflow. Developers receive contradictory directions, although the charter allows product decisions within defined compliance boundaries. Which TWO actions should the project manager take? Select TWO.","options":["Clarify decision rights and escalation thresholds with both parties.","Let developers follow whichever direction arrived most recently.","Document agreed boundaries and communicate them to the delivery team.","Require the board to approve every backlog refinement decision."],"id":"PE40","domain":"People","type":"multiple"},{"id":"BE26","domain":"Business Environment","task":5,"topic":"AI output uncertainty","approach":"Hybrid","type":"single","stem":"A hybrid project uses an AI assistant to draft technical acceptance tests. During a review, one generated test cites a nonexistent industry requirement. No tests have been approved or executed yet. What is the BEST response to manage the wider risk?","options":["Correct that citation and assume other generated tests are reliable because the error was isolated.","Publish the drafts with a disclaimer stating that the AI provider is responsible for technical accuracy.","Assess the draft set, require qualified verification against authoritative requirements, and improve the review control.","Remove all acceptance tests produced so far and cancel the project's automation objective permanently."]},{"id":"PR72","domain":"Process","task":7,"topic":"Quality practices","approach":"Hybrid","type":"matching","stem":"A hybrid delivery team wants to distinguish four quality activities so it can place them at appropriate points in its workflow. Each situation describes a different purpose rather than a specific mandatory technique. Match each situation with its MOST appropriate quality practice.","options":["Process audit","Preventive design review","Root-cause analysis","Acceptance testing"],"prompts":["Examine the design before implementation to prevent known failure modes.","Check whether the team follows the agreed delivery and inspection process.","Investigate why the same production defect keeps recurring.","Demonstrate that the delivered workflow meets agreed customer criteria."]},{"task":5,"topic":"Acceptance alignment","approach":"Predictive","stem":"A supplier and the customer's inspection team disagree about what constitutes an acceptable finish on custom equipment. The contract references an industry grade but examples used in meetings differed. Manufacturing is about to start. What should the project manager do next?","options":["Have the supplier follow its standard interpretation and inspect completed units.","Ask the customer to approve an additional contingency for possible rework.","Record both interpretations and let inspectors choose at delivery.","Facilitate clarification of measurable acceptance criteria with the authorized parties."],"id":"PE08","domain":"People","type":"single"},{"id":"BE47","domain":"Business Environment","task":8,"topic":"External change monitoring","approach":"Hybrid","type":"multiple","stem":"A hybrid mobility project depends on municipal approvals and changing customer travel patterns. The sponsor wants early warning when external conditions threaten its strategic value, but the team cannot investigate every news item. Which TWO actions create the most useful monitoring approach? Select TWO.","options":["Collect all transport news and count articles as the primary indicator of project exposure.","Define relevant external indicators, accountable monitoring owners, and thresholds that trigger impact assessment.","Review material signals with business stakeholders and update assumptions, risks, and decision options.","Monitor only events that have already caused a measurable baseline variance in the project schedule."]},{"id":"PR23","domain":"Process","task":6,"topic":"Estimate at completion","approach":"Predictive","type":"single","stem":"A predictive project has a budget at completion of $500,000. The finance team believes current cost efficiency will continue and does not expect schedule performance to affect future costs. Using the available performance data, which forecast should the project manager present?","options":["An estimate at completion of $625,000.","An estimate at completion of $750,000.","An estimate at completion of $400,000.","An estimate at completion of $500,000."],"table":{"headers":["Measure","Amount"],"rows":[["Budget at completion","$500,000"],["Earned value","$200,000"],["Actual cost","$250,000"]]}}];

<script>
(function(root){
  'use strict';
  const sections=[{name:'Case study',start:0,end:10},{name:'Independent questions I',start:10,end:95},{name:'Independent questions II',start:95,end:180}];
  const duration=240*60*1000, breakDuration=10*60*1000;
  function fresh(now=Date.now()){return {version:1,phase:'exam',section:0,index:0,answers:{},flags:[],startedAt:now,deadline:now+duration,remaining:duration,breakEnd:null,completedAt:null};}
  function answered(q,a){return Array.isArray(a)&&(q.type==='matching'?a.length===q.prompts.length&&a.every(x=>Number.isInteger(x)&&x>=0):a.length>0);}
  function correct(q,a,key){if(!answered(q,a))return false;return q.type==='matching'?JSON.stringify(a)===JSON.stringify(key.correct):JSON.stringify([...a].sort())===JSON.stringify([...key.correct].sort());}
  function remaining(s,now=Date.now()){return s.phase==='done'?0:s.phase==='break'?s.remaining:Math.max(0,s.deadline-now);}
  function reconcile(s,now=Date.now()){
    if(s.phase==='break'&&now>=s.breakEnd){s.phase='exam';s.deadline=s.breakEnd+s.remaining;s.breakEnd=null;}
    if(s.phase==='exam'&&s.deadline<=now){s.phase='done';s.completedAt=s.deadline;s.expired=true;}
    return s;
  }
  function finishSection(s,now=Date.now()){
    if(s.phase!=='exam')return s;
    reconcile(s,now);if(s.phase==='done')return s;
    if(s.section===2){s.phase='done';s.completedAt=now;s.expired=false;return s;}
    s.remaining=remaining(s,now);s.section++;s.index=sections[s.section].start;s.phase='break';s.breakEnd=now+breakDuration;return s;
  }
  function endBreak(s,now=Date.now()){if(s.phase==='break'){if(now>=s.breakEnd)return reconcile(s,now);s.phase='exam';s.deadline=now+s.remaining;s.breakEnd=null;}return s;}
  function canVisit(s,i){const r=sections[s.section];return s.phase==='exam'&&i>=r.start&&i<r.end;}
  function level(p){return p>=80?'Above Target':p>=70?'Target':p>=55?'Below Target':'Needs Improvement';}
  function score(qs,s,keys){
    const domains={},topics={};let n=0,u=0;
    const items=qs.map(q=>{const a=s.answers[q.id]||[];const ok=correct(q,a,keys[q.id]);const blank=!answered(q,a);n+=+ok;u+=+blank;
      const d=domains[q.domain]||={correct:0,total:0};d.total++;d.correct+=+ok;
      const t=topics[q.topic]||={correct:0,total:0,domain:q.domain};t.total++;t.correct+=+ok;
      return {id:q.id,ok,blank};
    });
    for(const d of Object.values(domains)){d.percent=d.correct/d.total*100;d.level=level(d.percent);}
    for(const t of Object.values(topics))t.percent=t.correct/t.total*100;
    const percent=n/qs.length*100;
    return {correct:n,incorrect:qs.length-n-u,unanswered:u,percent,pass:percent>=70,domains,topics,items};
  }
  root.ExamCore={sections,duration,breakDuration,fresh,answered,correct,remaining,reconcile,finishSection,endBreak,canVisit,level,score};
  if(typeof module!=='undefined')module.exports=root.ExamCore;
})(typeof window!=='undefined'?window:globalThis);

</script>
