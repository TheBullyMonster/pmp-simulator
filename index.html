window.QUESTIONS = [{"task":1,"topic":"Shared outcome","approach":"Hybrid","caseId":"harbor","stem":"The sponsor praises the pilot's initial reduction in missed visits and asks the team to accelerate deployment. Rural clinicians argue that the current experience excludes their patients. Team members disagree about what success means. What should the project manager do first?","options":["Translate the sponsor's deployment request into milestones for every participating site.","Facilitate agreement on shared outcomes and measurable success criteria across affected groups.","Ask each site to define independent targets and report its own success.","Use the missed-visit reduction as the primary criterion because it matches the original goal."],"id":"PE01","domain":"People","type":"single"},{"id":"PR01","domain":"Process","task":1,"topic":"Integrated delivery planning","approach":"Hybrid","type":"single","stem":"The hospital has scheduled its privacy approval for week twelve, while the interface team plans demonstrations every two weeks. Its draft release plan treats privacy testing as an activity after all demonstrations. What should the project manager do FIRST to establish a credible integrated delivery plan?","options":["Maintain separate plans and reconcile completion dates at the final demonstration.","Link privacy evidence and interface increments through explicit dependencies and acceptance milestones.","Freeze all interface requirements until the privacy authority approves the complete platform.","Ask the interface team to shorten every iteration to create an approval buffer."],"caseId":"harbor"},{"id":"BE01","domain":"Business Environment","task":1,"topic":"AI decision governance","approach":"Hybrid","caseId":"harbor","type":"single","stem":"The Harbor sponsor proposes allowing the AI assistant to publish schedules automatically because clinician reviews slow the pilot. The privacy gate remains mandatory, and clinicians have raised concerns about recommendations. What should the project manager do FIRST before recommending a change?","options":["Compare the approval change with agreed decision rights and assess safety, privacy, and accountability impacts.","Run automatic publishing for the most experienced clinicians and use their feedback to update governance.","Ask the vendor to confirm that its accuracy benchmark supports removing the human approval requirement.","Retain human approval permanently and remove automation improvements from all future release discussions."]},{"task":2,"topic":"AI-related conflict","approach":"Hybrid","caseId":"harbor","stem":"A clinician refuses to review AI-drafted schedules after observing an inappropriate recommendation. An engineer says the clinician is blocking learning and wants the concern recorded as resistance. Their disagreement is delaying pilot feedback. What is the best next action?","options":["Ask the sponsor to reaffirm mandatory participation in the approved pilot.","Suspend all scheduling experiments until the clinicians accept the technology.","Meet with both parties to explore the concern and agree safe review and feedback practices.","Replace the clinician on the pilot with someone who supports AI experimentation."],"id":"PE02","domain":"People","type":"single"},{"id":"PR02","domain":"Process","task":2,"topic":"Scope decomposition","approach":"Hybrid","type":"single","stem":"Clinicians describe the hospital's scheduling feature as complete when it produces a suggested appointment. Operations describes completion as a suggestion that a clinician has approved and the patient can access. Developers have already divided the feature into technical components. What is the BEST next step?","options":["Let the AI supplier define completion because it owns the recommendation engine.","Defer the disagreement until users evaluate the final integrated demonstration.","Use the technical component list as the scope boundary for the first pilot.","Facilitate agreement on end-to-end acceptance criteria and then refine the work breakdown."],"caseId":"harbor"},{"id":"BE02","domain":"Business Environment","task":6,"topic":"Outcome feedback","approach":"Hybrid","caseId":"harbor","type":"single","stem":"Harbor's first pilot shows missed visits down 6%, with rural satisfaction of 52% and urban satisfaction of 84%. The sponsor wants to expand immediately because the trend is positive. Which NEXT action best supports continuous improvement toward the agreed business outcome?","options":["Expand to all clinics and compare total appointment volumes at the next quarterly review.","Replace the 20% target with the pilot result so that benefits reporting reflects demonstrated performance.","Investigate rural barriers with patients and clinicians, then test a targeted improvement against outcome measures.","Add interface features requested by urban clinics because their satisfaction indicates stronger adoption potential."]},{"task":4,"topic":"Inclusive engagement","approach":"Hybrid","caseId":"harbor","stem":"Pilot feedback sessions attract mostly urban staff, while rural representatives rarely attend because clinic coverage is limited. The product owner proposes proceeding with the existing feedback to protect the privacy milestone. Which TWO actions should the project manager take? Select TWO.","options":["Offer asynchronous and short local feedback sessions that fit rural coverage constraints.","Use urban satisfaction as a proxy until a larger rural sample becomes available.","Ask rural managers to nominate representatives and identify practical participation barriers.","Defer rural involvement until after the privacy gate to avoid competing priorities."],"id":"PE03","domain":"People","type":"multiple"},{"id":"PR03","domain":"Process","task":3,"topic":"Attribution of measured benefits","approach":"Hybrid","type":"single","stem":"An analyst claims Harbor's reported reduction proves that the platform caused fewer missed visits. However, appointment volume changed during the pilot, and a separate patient transport initiative began. The sponsor needs credible evidence of the platform's contribution to the benefit. Which measurement plan BEST supports that assessment?","options":["Compare total missed visits before and during the pilot, then attribute the difference to the platform's release.","Compare changes in missed-visit rates against comparable nonpilot clinics with similar exposure to the transport initiative.","Compare platform users with nonusers during the pilot and attribute every difference to the scheduling technology.","Compare the number of attended platform appointments with the missed-visit count recorded before the pilot began."],"caseId":"harbor"},{"id":"BE03","domain":"Business Environment","task":7,"topic":"Adoption and operational change","approach":"Hybrid","caseId":"harbor","type":"multiple","stem":"Harbor adoption is 45%, although delivered scheduling functions meet their acceptance criteria. Department heads say staff still use their old workflows, and the sponsor links funding to sustained reductions in missed visits. Which TWO actions best address organizational readiness? Select TWO.","options":["Work with department leaders to redesign affected workflows and assign operational ownership of adoption measures.","Declare the release successful because accepted functionality satisfies the project team's delivery commitment.","Co-design role-specific practice sessions with clinicians and collect feedback on obstacles to routine use.","Require every clinic to stop its old process immediately so that adoption reaches the funding threshold."]},{"id":"PR04","domain":"Process","task":7,"topic":"Sustainability acceptance measures","approach":"Hybrid","type":"single","stem":"The hospital evaluates two deployment configurations after identical appointment workloads. Both meet response-time and privacy acceptance criteria. The team must meet its stated energy reduction target relative to the baseline before recommending a configuration. Based on the measurements, which recommendation is BEST supported?","options":["Recommend configuration B because it reduces energy use by 12%.","Recommend either configuration because both meet functional criteria.","Recommend neither configuration because the reduction must exceed 20%.","Recommend configuration A because it reduces energy use by 9%."],"caseId":"harbor","table":{"headers":["Configuration","Energy per standard workload"],"rows":[["Baseline","100 kWh"],["A","91 kWh"],["B","88 kWh"]]}},{"task":6,"topic":"Pilot interpretation","approach":"Hybrid","stem":"A pilot improves average service time, and the sponsor declares the change a success. However, the sample excludes the busiest branch, where employees expect a different workload pattern. A rollout decision is due next week. What should the project manager do?","options":["Use the average result because the pilot met its reporting target.","Explain the evidence limitation and agree additional validation needed for rollout.","Declare the pilot unsuccessful because it did not represent every branch.","Let the busiest branch opt out without discussing the rollout objective."],"id":"PE49","domain":"People","type":"single"},{"task":4,"topic":"Engagement approach matching","approach":"Predictive","type":"matching","stem":"A project manager is tailoring engagement for three stakeholders on a records-management replacement. Their needs differ even though all receive the same monthly report today. Match each stakeholder situation to the initial engagement action that would most directly improve meaningful participation.","prompts":["A records clerk has little formal authority and valuable workflow knowledge.","An executive sponsor must decide between two funding options this week.","A regulator needs evidence that mandatory retention rules are satisfied."],"options":["Provide traceable compliance evidence through the formal review channel.","Invite participation in workflow discovery and validation sessions.","Present a concise decision brief comparing business consequences."],"id":"PE22","domain":"People"},{"id":"BE44","domain":"Business Environment","task":6,"topic":"Learning from failed experiment","approach":"Agile","type":"single","stem":"An agile team tests a recommendation feature with a limited customer group. The agreed outcome measure does not improve, although users praise the visual design. The product owner wants to launch widely because significant effort has already been invested. What is the BEST recommendation?","options":["Release to a larger audience to obtain more representative data before reviewing the current outcome hypothesis.","Extend the existing experiment for another release cycle and preserve the original feature plan while gathering additional results.","Prioritize usability refinements suggested by participants and repeat the experiment after those improvements are delivered.","Review the hypothesis and evidence, then adapt or stop the feature based on expected future value."]},{"task":8,"topic":"Audience-appropriate incident communication","approach":"Agile","stem":"An agile team prepares a sprint-review presentation describing a resolved customer-service incident. Screenshots include customer names and account balances, and the audience includes external partners who are not authorized to see those details. What should the project manager ask the team to do before presenting?","options":["Show the screenshots briefly and ask attendees not to record the presentation.","Exclude the incident entirely so no stakeholder learns that it occurred.","Keep the screenshots but place a confidentiality notice on the opening slide.","Use redacted or synthetic evidence and explain the impact and resolution at an appropriate level."],"id":"PE43","domain":"People","type":"single"},{"id":"PR68","domain":"Process","task":2,"topic":"Acceptance examples","approach":"Hybrid","type":"single","stem":"A hybrid team is building a discount engine. Business stakeholders agree that discounts should be fair, but developers interpret overlapping promotions differently and testers cannot determine expected results. The next iteration is about to start. What should the project manager facilitate FIRST?","options":["A larger estimate to cover every possible interpretation of fairness.","Coding the most common interpretation and resolving disagreements after release.","A vote among developers to select the least complex pricing rule.","Concrete examples and agreed acceptance rules for overlapping promotions."]},{"id":"PR30","domain":"Process","task":7,"topic":"Acceptance versus verification","approach":"Predictive","type":"single","stem":"A predictive software project has passed every internal functional test. During a scheduled acceptance session, the authorized customer representative says the deliverable meets the agreed criteria and signs the acceptance record. Which statement BEST explains the distinction between these two activities?","options":["Both activities are financial controls, so either can replace the other.","Customer acceptance eliminates the need to retain internal test evidence.","Internal tests automatically confer customer acceptance once all defects are removed.","Internal tests verify conformance, while customer acceptance formally accepts the deliverable."]},{"task":6,"topic":"Expectation monitoring","approach":"Predictive","stem":"A steering committee approved a phased rollout three months ago. New department managers now expect every site to launch simultaneously, although the approved plan has not changed. Their operational preparations are becoming inconsistent. What should the project manager do next?","options":["Reconfirm rollout expectations with new managers and update engagement arrangements.","Rely on the original meeting minutes as sufficient evidence of agreement.","Change the rollout sequence to reflect the managers' current assumptions.","Ask the sponsor to exclude new managers from rollout planning."],"id":"PE23","domain":"People","type":"single"},{"id":"BE08","domain":"Business Environment","task":5,"topic":"Residual risk","approach":"Predictive","type":"single","stem":"A bridge project installs sensors to detect unusual movement during construction. The response reduces the chance of undetected instability but does not eliminate it. A manager wants the original risk closed because the sensors passed testing. What should the project manager do NEXT?","options":["Close the risk and reopen it only if a sensor reports movement beyond the operating threshold.","Assess residual exposure, confirm monitoring and response ownership, and update the risk record.","Transfer responsibility for every structural risk to the sensor supplier under its maintenance agreement.","Keep the original exposure unchanged because technical controls cannot be credited before project closure."]},{"id":"BE18","domain":"Business Environment","task":6,"topic":"Root-cause learning","approach":"Predictive","type":"single","stem":"Monthly project audits repeatedly find incomplete supplier inspection records. Team members correct each file before the audit closes, but the same issue appears in the next period. What should the project manager do NEXT to prevent recurrence rather than only repair individual records?","options":["Increase the number of records sampled so every missing field is found before the final audit.","Investigate the record-creation workflow with suppliers and test a control addressing the underlying failure.","Assign all missing records to the quality manager because audit findings belong to that role.","Postpone future audits until suppliers confirm every inspection document is complete and consistent."]},{"task":6,"topic":"Managing forecast disappointment","approach":"Predictive","stem":"A laboratory relocation is forecast to finish two weeks later than the baseline after a permitting delay. The sponsor continues telling department heads that the original date is secure. The schedule analysis is complete and includes feasible recovery options. What should the project manager do?","options":["Discuss the evidence and options with the sponsor and agree accurate stakeholder communication.","Keep the original date in presentations until a change request is approved.","Send department heads the revised forecast without coordinating the explanation.","Commit to the original date and request overtime once the permit arrives."],"id":"PE09","domain":"People","type":"single"},{"task":7,"topic":"Learning verification","approach":"Hybrid","stem":"A support team attends training for a new service and gives the instructor excellent ratings. During a readiness exercise, members cannot complete the escalation workflow without help. The launch decision is approaching. What should the project manager do with this evidence?","options":["Arrange targeted practice and reassess support's ability to perform the workflow.","Accept satisfaction ratings because required training sessions were delivered.","Ask the instructor to provide a longer slide deck before launch.","Transfer escalation duties permanently to the project team to avoid training."],"id":"PE56","domain":"People","type":"single"},{"id":"PR37","domain":"Process","task":2,"topic":"Backlog refinement","approach":"Agile","type":"single","stem":"An agile team repeatedly carries a large reporting story across iterations. Its acceptance criteria combine five unrelated user decisions, and estimates vary widely because developers imagine different solutions. What should the project manager facilitate FIRST to improve delivery readiness?","options":["Split the story into smaller user-valued outcomes and clarify acceptance examples.","Assign the entire story to the fastest developer without further discussion.","Double the story points until the estimate accommodates every imagined solution.","Remove acceptance criteria so the team can interpret completion flexibly."]},{"task":3,"topic":"Leadership under misleading comparison","approach":"Agile","stem":"An executive compares two agile teams by their story-point totals and asks the lower-scoring team to double its estimates to demonstrate improvement. Team members worry that honest reporting will damage their reputation. What should the project manager do to provide effective leadership?","options":["Explain why team-specific estimates are not comparable and propose evidence of delivered value and quality.","Allow larger estimates temporarily while the team establishes credibility with the executive.","Require both teams to use identical point values before their next planning session.","Stop reporting any delivery measures until the executive withdraws the comparison."],"id":"PE52","domain":"People","type":"single"},{"id":"BE15","domain":"Business Environment","task":5,"topic":"Risk response selection","approach":"Predictive","type":"matching","stem":"A construction project is selecting responses for three distinct exposures before execution begins. Each proposed response has a different mechanism, and the project manager wants the risk register to reflect the mechanism accurately. Match each response with the most appropriate risk response strategy.","prompts":["Remove the hazardous work package by choosing a feasible alternative design.","Purchase insurance for eligible financial losses while retaining incident management duties.","Install barriers that reduce the probability of equipment entering a protected area."],"options":["Mitigate the threat","Avoid the threat","Transfer financial exposure"]},{"id":"PR22","domain":"Process","task":3,"topic":"Lifecycle value of phased commissioning","approach":"Predictive","type":"single","stem":"A predictive pumping-station project compares early partial commissioning with handover of the entire station at once. Both options meet safety and technical criteria. Relative to the later handover, early operation saves $60,000 in measured fuel costs but adds $15,000 in staged testing and $20,000 in lifecycle maintenance. No other costs or benefits differ. Which conclusion BEST supports the delivery decision?","options":["Early commissioning offers $60,000 more value because operating savings are the benefit measure.","Early commissioning offers $45,000 more value because maintenance occurs after project delivery.","Early commissioning offers $25,000 more net value when all stated lifecycle differences are included.","Later handover offers $35,000 more value because it avoids both additional expenditure categories."]},{"id":"BE21","domain":"Business Environment","task":5,"topic":"Correlated risk","approach":"Predictive","type":"single","stem":"Three critical components come from different suppliers, and each has a low individual delay probability. The procurement lead then learns that all three depend on the same overseas port during a forecast severe weather season. What should the project manager do NEXT?","options":["Request updated delay probabilities from each supplier and assess the three shipments separately against their delivery buffers.","Increase the contingency allowance for the highest-priced component and leave the other two shipment plans unchanged.","Ask all suppliers to purchase delay insurance before revisiting the integrated project schedule exposure.","Assess the shared dependency and combined schedule exposure, then evaluate diversified logistics or contingency responses."]},{"id":"PR14","domain":"Process","task":10,"topic":"Formal closure","approach":"Predictive","type":"single","stem":"A data center relocation has passed technical tests and moved all users successfully. The project team is being reassigned, but operations has not accepted the support documentation and one vendor invoice is disputed. What should the project manager do NEXT?","options":["Retain the whole project team until the disputed invoice is paid.","Complete the agreed handover and resolve or formally transfer outstanding obligations.","Transfer all remaining work to operations without documenting acceptance.","Announce closure because production operation demonstrates completion."]},{"id":"PR69","domain":"Process","task":4,"topic":"Resource sustainability","approach":"Agile","type":"multiple","stem":"An agile team has met three deadlines through weekend work. Unfinished items are increasing, and team members report fatigue. The product owner says the same pace is necessary for the next six months. What should the project manager facilitate? Select TWO.","options":["Replan delivery using sustainable capacity and transparent prioritization.","Inspect workflow constraints and reduce avoidable unfinished work.","Make recurring overtime the baseline assumption for all remaining iterations.","Measure commitment by individual hours rather than completed usable outcomes."]},{"id":"PR61","domain":"Process","task":8,"topic":"Empirical release forecast","approach":"Agile","type":"single","stem":"An agile team estimated a release using its first iteration's unusually high throughput. Four later iterations show lower but stable throughput after integration work was included. No scope reduction has been approved. What should the project manager do NEXT when discussing the release date?","options":["Exclude integration work from the data so throughput matches the first iteration.","Require a return to the first iteration's rate without investigating the work mix.","Update the forecast using representative recent delivery data and explain the assumptions.","Retain the original forecast because changing it would undermine team accountability."]},{"id":"BE30","domain":"Business Environment","task":5,"topic":"Risk discovery in adaptive work","approach":"Agile","type":"multiple","stem":"A team is integrating an unfamiliar identity provider. Authentication succeeds in a small demonstration, but latency under regional load and behavior during outages remain unknown. The feature is high value and can be delivered incrementally. Which TWO actions best manage uncertainty? Select TWO.","options":["Commit the full release date using the demonstration as proof that integration risks are resolved.","Run a time-boxed technical experiment against representative load and outage conditions.","Record the remaining exposures with owners, response triggers, and monitoring as delivery proceeds.","Defer discussion of integration risks until acceptance testing so the team can maintain delivery momentum."]},{"id":"PR42","domain":"Process","task":10,"topic":"Incremental transition","approach":"Hybrid","type":"single","stem":"A hybrid project releases a new claims workflow in three regions over successive months. The first region is stable, but operations says each release has arrived with different support material. What should the project manager establish before the next regional transition?","options":["A repeatable handover checklist with agreed readiness evidence and owners.","One final support manual produced only after every region is live.","A requirement that the development team handle all support indefinitely.","A closure report listing only the software features released in each region."]},{"id":"PR70","domain":"Process","task":6,"topic":"Cost forecast from remaining work","approach":"Hybrid","type":"single","stem":"A hybrid migration has spent $120,000. After completing a difficult integration, the team prepares a fresh bottom-up estimate of $80,000 for all remaining work. Finance agrees this new estimate is more representative than past efficiency. What total completion forecast should the project manager report?","options":["$240,000.","$80,000.","$120,000.","$200,000."],"table":{"headers":["Measure","Amount"],"rows":[["Actual cost to date","$120,000"],["New bottom-up estimate to complete","$80,000"]]}},{"id":"PR16","domain":"Process","task":6,"topic":"Earned value interpretation","approach":"Predictive","type":"single","stem":"At the monthly review of a predictive upgrade, the sponsor sees that actual expenditure is below planned value and calls the project healthy. The team uses consistent earned-value measurement and the figures shown are current. What is the MOST accurate response?","options":["The project is under budget and ahead because actual cost is below planned value.","The project is over budget for completed work and behind its planned progress.","The project is under budget for completed work but behind its planned progress.","The project is over budget for completed work but ahead of its planned progress."],"table":{"headers":["Measure","Amount"],"rows":[["Planned value","$96,000"],["Earned value","$72,000"],["Actual cost","$90,000"]]}},{"task":1,"topic":"New team members","approach":"Hybrid","stem":"Several contractors join a long-running transformation project and immediately optimize their assigned components for local efficiency. Existing team members say the changes undermine a shared customer journey. The contractors received technical onboarding but no explanation of project outcomes. What should the manager do first?","options":["Reconnect contributors to the shared vision and discuss cross-component success criteria.","Reverse every contractor change until they have six weeks of experience.","Assign experienced staff to approve contractor decisions indefinitely.","Add detailed component specifications without discussing customer outcomes."],"id":"PE44","domain":"People","type":"single"},{"id":"PR43","domain":"Process","task":6,"topic":"Agile funding forecast","approach":"Agile","type":"single","stem":"An agile team has completed three iterations and has a reliable average running cost. The remaining backlog is still changing, and the sponsor asks how much funding to authorize for the next learning stage. What is the BEST approach?","options":["Avoid financial forecasts until the entire product backlog becomes stable.","Forecast the bounded next stage using team cost, duration, and explicit assumptions.","Promise the entire evolving backlog for the remaining original budget.","Treat story points as a fixed currency that never changes across teams."]},{"id":"PR46","domain":"Process","task":1,"topic":"AI-assisted planning","approach":"Hybrid","type":"single","stem":"A hybrid delivery team uses an AI assistant to draft an integrated schedule from previous projects. The draft looks complete but assumes a supplier lead time that contradicts the signed agreement and omits a local testing dependency. What should the project manager do NEXT?","options":["Have accountable specialists validate assumptions and dependencies before baselining.","Remove all estimation technology from the project for the remaining lifecycle.","Average the AI lead time with the contractual lead time to avoid bias.","Publish the draft because the model used many historical examples."]},{"id":"BE43","domain":"Business Environment","task":7,"topic":"Organizational change interventions","approach":"Hybrid","type":"matching","stem":"A project manager is preparing a transition plan for a new service platform. Interviews reveal three different barriers to sustained use, and the team wants targeted interventions instead of sending everyone the same announcement. Match each barrier with the most suitable initial organizational change intervention.","prompts":["Users understand the benefit but cannot complete their new daily tasks.","Managers disagree about who will monitor the outcome after project closure.","Frontline staff believe the change ignores important local workflow conditions."],"options":["Co-design local workflow adaptations with affected representatives","Agree an accountable operational benefit owner and review cadence","Provide role-based practice and accessible task support"]},{"task":3,"topic":"Team recognition","approach":"Predictive","stem":"After a major milestone, the sponsor praises only the design group, although field technicians identified defects that would have blocked acceptance. The technicians become less willing to raise concerns. What should the project manager do to reinforce effective team behavior?","options":["Recognize technicians' contributions and encourage acknowledgment of interdependent team efforts.","Explain that sponsor recognition naturally focuses on the most visible deliverables.","Create a competition rewarding whichever group reports the most defects.","Ask technicians to route future findings through designers for visibility."],"id":"PE27","domain":"People","type":"single"},{"id":"PR40","domain":"Process","task":5,"topic":"Adaptive procurement","approach":"Hybrid","type":"single","stem":"A project needs a vendor to help discover an unfamiliar customer workflow. Detailed feature scope cannot be fixed responsibly yet, but the buyer needs expenditure control and frequent opportunities to evaluate results. Which procurement design BEST balances these needs?","options":["An unlimited time-and-materials agreement without intermediate acceptance.","A purchase order that measures success only by vendor headcount.","A single fixed-price contract with every feature specified before discovery.","Time-boxed discovery and delivery increments with spending limits and review points."]},{"id":"PR63","domain":"Process","task":4,"topic":"Capacity planning","approach":"Agile","type":"single","stem":"An agile team has ten working days in its next iteration. Two members will attend approved training, and a shared tester is available for only half the period. Historical velocity assumes full availability. What should guide the team's planning conversation FIRST?","options":["Actual availability and the skills needed to finish complete items.","The highest historical velocity so the team stays ambitious.","The number of requests waiting in the product owner's inbox.","Equal allocation of story points to every team member regardless of specialty."]},{"id":"PR62","domain":"Process","task":7,"topic":"Defect data analysis","approach":"Hybrid","type":"single","stem":"A hybrid team has one improvement workshop available before its next release. All defects in the table have similar severity and average correction effort. The team wants to address the largest recurring source first. Which category should guide the initial root-cause investigation?","options":["Formatting defects.","Integration defects.","Documentation defects.","Validation defects."],"table":{"headers":["Category","Defects"],"rows":[["Validation","18"],["Formatting","10"],["Integration","42"],["Documentation","10"]]}},{"id":"BE06","domain":"Business Environment","task":3,"topic":"Integrated change assessment","approach":"Predictive","type":"single","stem":"A public library project receives a request to add rooftop solar panels. The sponsor says the change supports organizational sustainability commitments and offers contingency funding, but structural design is already approved. What should the project manager do FIRST before committing the funding?","options":["Assess structural, procurement, schedule, benefit, and compliance impacts through the established change process.","Approve the addition because sustainability commitments take precedence over the existing design baseline.","Use contingency to place the order while the engineering team checks whether the roof can support it.","Reject the request because sustainability requirements must be identified before the design is approved."]},{"id":"PR10","domain":"Process","task":5,"topic":"Procurement strategy","approach":"Predictive","type":"single","stem":"A city must procure standardized meters with stable specifications and objectively measurable acceptance criteria. Several qualified suppliers can price the complete delivery, and the city wants predictable acquisition cost. Which contract approach should the project manager recommend as the starting point for negotiation?","options":["Cost reimbursable because the meters have measurable acceptance criteria.","Time and materials because the total quantity is already defined.","Firm fixed price with clear delivery and acceptance obligations.","An unpriced letter of intent covering the entire acquisition."]},{"task":8,"topic":"Crisis coordination","approach":"Hybrid","stem":"During a service cutover, three team channels publish different restoration estimates after an unexpected outage. Customer support is giving conflicting messages, and engineers are still investigating. What should the project manager establish immediately to improve communication while technical recovery continues?","options":["Ask each technical lead to send customers a component estimate.","Agree one update source, distinguish facts from estimates, and set an update cadence.","Suspend customer communication until service has fully recovered.","Select the earliest estimate to maintain confidence and revise only if missed."],"id":"PE57","domain":"People","type":"single"},{"task":6,"topic":"Scope expectation reset","approach":"Predictive","stem":"A customer executive expects a training service that appears in an early proposal but was excluded from the signed scope. The delivery team has not budgeted for it, and the executive considers it essential to adoption. What should the project manager do first?","options":["Discuss the discrepancy and desired outcome, then explain the available change process.","Reject the request by sending the signed scope with the exclusion highlighted.","Ask the team to provide informal training within existing effort estimates.","Promise the service while asking the sponsor privately to locate funding."],"id":"PE17","domain":"People","type":"single"},{"id":"BE40","domain":"Business Environment","task":2,"topic":"Environmental compliance evidence","approach":"Hybrid","type":"multiple","stem":"A hybrid data-center upgrade includes an environmental commitment and a mandatory equipment-disposal requirement. A supplier reports that old devices were responsibly recycled but provides only a marketing brochure. Which TWO actions best support defensible compliance and sustainability reporting? Select TWO.","options":["Report the supplier's sustainability claim as verified because its brochure describes an established recycling program.","Obtain traceable disposal evidence for the actual equipment against the applicable requirements.","Combine estimated energy savings and unverified disposal claims into one overall green performance score.","Assign accountable review of the evidence and distinguish verified results from assumptions in reporting."]},{"id":"PR31","domain":"Process","task":4,"topic":"Physical resource lifecycle","approach":"Predictive","type":"single","stem":"A construction team orders all materials at project start to secure a discount. The site has limited covered storage, and several materials deteriorate if exposed before installation. The procurement schedule was not integrated with installation sequencing. What should the project manager do NEXT?","options":["Compare phased deliveries and storage needs against the total acquisition and handling cost.","Purchase extra materials to offset the expected deterioration.","Keep the order unchanged because unit-price savings demonstrate optimal resource use.","Assign the storage problem to the supplier without reviewing the agreement."]},{"id":"PR55","domain":"Process","task":3,"topic":"Outcome-based prioritization","approach":"Agile","type":"single","stem":"A subscription product team is rewarded for releasing many small features, but customer activation has remained flat for three months. The product owner has not linked upcoming work to an activation hypothesis. What should the project manager encourage the team to do NEXT?","options":["Use completed story points as a substitute for activation performance.","Stop all delivery until the annual benefits review provides a complete explanation.","Connect candidate work to measurable activation outcomes and review evidence after delivery.","Increase the feature count target to create greater release momentum."]},{"id":"PR58","domain":"Process","task":2,"topic":"Scope boundary","approach":"Hybrid","type":"single","stem":"A hybrid analytics project has an agreed objective to support regional sales decisions. During refinement, the team discovers two proposed dashboards answer the same decision question using different layouts. Capacity is constrained, and neither layout is contractually required. What should the project manager facilitate NEXT?","options":["Clarify the underlying user need and refine the backlog to avoid unnecessary duplicate scope.","Build both dashboards so every initial idea is represented in the release.","Ask developers to merge the layouts without checking user decision needs.","Remove all dashboard work until the sponsor defines individual screen designs."]},{"task":4,"topic":"User representation","approach":"Agile","stem":"An internal product's sprint reviews are attended by managers, but the frontline employees who will use it are consistently absent. Managers approve each increment, while a usability test reveals serious workflow problems. What should the project manager do to improve stakeholder engagement?","options":["Include representative frontline users in feedback through arrangements fitting their shifts.","Ask managers to provide more detailed sign-off before each release.","Replace all management participation with individual user interviews.","Wait for production usage data before changing the review audience."],"id":"PE31","domain":"People","type":"single"},{"id":"PR74","domain":"Process","task":9,"topic":"Decision-ready status","approach":"Hybrid","type":"single","stem":"A hybrid deployment reports green for completed build milestones, but operational rehearsal has not occurred and the release decision is tomorrow. The project manager is asked to prepare a concise decision pack. Which content is MOST useful for the release authority?","options":["Verified readiness evidence, unmet criteria, forecast implications, and the decision required.","A chronological account of every team meeting since project initiation.","Only the green build milestones because those are already complete.","A single confidence percentage without its assumptions or supporting evidence."]},{"task":7,"topic":"Knowledge transfer across confidentiality boundaries","approach":"Agile","stem":"A vendor's specialist offers to teach an agile team a valuable troubleshooting technique using examples from another client's production system. The examples contain confidential customer configurations covered by the vendor's agreement. The team needs the technique for an upcoming increment. What should the project manager do?","options":["Accept the session if team members promise not to redistribute the examples.","Cancel knowledge transfer and let the team reconstruct the technique independently.","Arrange a session using authorized, sanitized examples that preserve the troubleshooting reasoning.","Ask the vendor to remove client names while retaining all configuration details."],"id":"PE42","domain":"People","type":"single"},{"task":3,"topic":"AI leadership judgment","approach":"Agile","stem":"A delivery manager wants to rank team members using an AI tool that summarizes activity from code commits and chat messages. Several contributors do research and mentoring that the tool does not capture. What should the project manager do before using the rankings?","options":["Publish rankings with a note that the tool may be incomplete.","Use rankings only for people producing sufficient commit data.","Evaluate limitations and agree fair, transparent performance evidence with the team.","Ask the tool to infer missing contributions from job titles."],"id":"PE38","domain":"People","type":"single"},{"id":"PR54","domain":"Process","task":10,"topic":"Learning at closure","approach":"Hybrid","type":"single","stem":"A hybrid pilot is ending after demonstrating that users prefer a simpler process than originally expected. The production team will use a different supplier. The project manager wants to preserve learning without carrying unvalidated assumptions into rollout. What should the closure package emphasize?","options":["A declaration that pilot success guarantees the same outcome at full scale.","Validated findings, supporting evidence, unresolved assumptions, and transition ownership.","Only the original business case because later findings may confuse the new supplier.","Every chat message in chronological order without synthesis or ownership."]},{"id":"PR44","domain":"Process","task":8,"topic":"Throughput forecasting","approach":"Hybrid","type":"single","stem":"A service team has completed a stable average of eight similarly sized items per week over the last six weeks. Twenty-four comparable items remain, and capacity and workflow conditions are expected to continue. What forecast should the project manager communicate, with its assumptions?","options":["No forecast is possible until every remaining item has an hourly estimate.","Approximately two weeks, because the team has six weeks of experience.","Approximately three weeks, subject to continued comparable throughput.","Exactly four weeks, because historical averages must include a safety multiplier."],"table":{"headers":["Input","Observed value"],"rows":[["Recent average throughput","8 items/week"],["Comparable items remaining","24"],["Expected capacity","Unchanged"]]}},{"id":"BE10","domain":"Business Environment","task":7,"topic":"Transition readiness","approach":"Predictive","type":"single","stem":"A warehouse automation project is approaching handover. Equipment meets all contracted specifications, but supervisors have not assigned maintenance responsibilities or approved revised safety routines. The vendor requests acceptance so it can demobilize. What is the BEST action for the project manager?","options":["Accept the equipment and ask supervisors to resolve operating responsibilities during the warranty period.","Retain the vendor indefinitely until warehouse productivity reaches the full business-case forecast.","Treat operating routines as outside project scope because the equipment meets contracted specifications.","Review agreed transition criteria with operations and close readiness gaps before the affected handover approval."]},{"task":5,"topic":"Sprint expectation alignment","approach":"Agile","stem":"A sales leader believes a demonstration means a feature is ready for customers. The team considers it a learning prototype without production security controls. A customer announcement is planned tomorrow. What should the project manager help the product owner do immediately?","options":["Release the prototype to meet the announcement and add controls afterward.","Clarify readiness expectations with sales and agree accurate customer messaging.","Cancel all demonstrations until the entire product is complete.","Ask developers to label the prototype clearly after the announcement."],"id":"PE32","domain":"People","type":"single"},{"id":"BE09","domain":"Business Environment","task":6,"topic":"Transferable improvement","approach":"Predictive","type":"multiple","stem":"A manufacturing expansion repeatedly discovers drawing inconsistencies during installation. A structured review identifies missing checks at design handoffs, and the team proposes a revised checklist. Which TWO actions best turn this lesson into measurable continuous improvement for the remaining work? Select TWO.","options":["Pilot the checklist on the next handoff and compare inconsistency rates with the previous baseline.","Store the lesson in the final report and continue the current process until project closure.","Add more approval signatures without identifying which design conditions each reviewer should verify.","Assign ownership for the revised handoff practice and share validated results with other project teams."]},{"id":"PR34","domain":"Process","task":10,"topic":"Operational readiness","approach":"Predictive","type":"single","stem":"A predictive transport project is technically complete, but the operator's maintenance team has not practiced emergency recovery. The handover criteria explicitly require a successful recovery exercise. The sponsor wants to close before month end. What should the project manager recommend?","options":["Remove the exercise from the record because it is operational rather than technical.","Ask the vendor to sign acceptance on behalf of the operator.","Complete and document the required exercise before claiming handover criteria are met.","Close now because ordinary operation has already demonstrated technical completion."]},{"task":4,"topic":"Stakeholder engagement strategy","approach":"Predictive","stem":"A finance director has high influence over funding but rarely attends steering meetings. Her objections emerge only after decisions have been recorded, causing reversals. The project manager learns she needs concise financial scenarios before discussions. What is the most effective next step?","options":["Require her attendance by asking the sponsor to change committee rules.","Copy her on detailed technical minutes immediately after each meeting.","Agree a targeted premeeting briefing and a clear opportunity for input.","Remove her from routine engagement and let the sponsor represent finance."],"id":"PE15","domain":"People","type":"single"},{"id":"PR18","domain":"Process","task":5,"topic":"Vendor performance","approach":"Predictive","type":"single","stem":"A supplier reports every fabrication milestone as complete, but incoming inspection reveals missing material certificates required by the contract. The shipment is physically usable, and the site team wants to accept it to protect schedule. What should the project manager do FIRST?","options":["Terminate the supplier immediately for failing one administrative requirement.","Pay the final amount and retain an informal note about the missing certificates.","Approve full acceptance because physical delivery meets the immediate site need.","Review the acceptance obligations with procurement and require the missing evidence."]},{"id":"PR49","domain":"Process","task":7,"topic":"AI output quality","approach":"Agile","type":"single","stem":"An agile team adds an AI summarizer to an internal case-management tool. Several summaries are fluent but omit important exceptions. Users could make incorrect routing decisions if these omissions pass unnoticed. What should the team establish FIRST as part of its quality plan?","options":["A release target based solely on the number of summaries generated each hour.","Representative evaluation cases, omission thresholds, and accountable human review criteria.","A check that every summary is grammatically correct and shorter than the input.","An assumption that greater model size eliminates the need for acceptance testing."]},{"id":"PR39","domain":"Process","task":4,"topic":"Flow and resource utilization","approach":"Agile","type":"single","stem":"A product team keeps every specialist fully occupied by starting new work whenever that specialist becomes free. The number of unfinished items keeps rising, and testing is the persistent bottleneck. What should the project manager help the team try NEXT?","options":["Evaluate individuals primarily on whether they are busy every hour.","Move unfinished tests into the following iteration and count development as delivery.","Limit work in progress and collaborate to finish items at the bottleneck.","Increase the number of development tasks so testers always have a larger queue."]},{"id":"BE14","domain":"Business Environment","task":3,"topic":"Emergency change authority","approach":"Predictive","type":"single","stem":"During a scheduled hospital power-system replacement, engineers discover a configuration that threatens patient-area power continuity. The change plan includes an emergency authorization path, but the normal change board meets next week. What should the project manager do NEXT while maintaining governance?","options":["Wait for the normal board meeting while installation proceeds according to the original approved design.","Authorize any engineer to redesign the system because patient safety eliminates documentation requirements.","Apply the emergency authority procedure, contain the exposure, and record decisions and required follow-up review.","Cancel the project immediately because the baseline configuration can no longer be delivered safely."]},{"id":"PR26","domain":"Process","task":1,"topic":"Estimating basis","approach":"Predictive","type":"single","stem":"A sponsor asks for a precise construction estimate before site surveys are complete. A comparable project is available, but its access conditions and material specifications differ substantially. The project manager must support an upcoming funding decision. What is the MOST appropriate response?","options":["Use the comparable project's final cost as an exact estimate.","Provide a suitable estimate range with assumptions and a plan to refine it.","Refuse to provide any estimate until every work package is defined.","Ask each contractor for a fixed price without disclosing missing site information."]},{"id":"PR56","domain":"Process","task":1,"topic":"Integrated release planning","approach":"Hybrid","type":"single","stem":"A hardware team delivers on a quarterly milestone plan while firmware evolves in short iterations. The latest release forecast ignores the test rig needed by both teams in the same week. What should the project manager do NEXT to improve the integrated plan?","options":["Allow each team to preserve its plan and negotiate access on the day.","Add the two teams' reported completion percentages to estimate readiness.","Make the shared rig dependency visible and align test windows with both teams.","Require the firmware team to abandon iterations and use the hardware schedule unchanged."]},{"id":"PR13","domain":"Process","task":9,"topic":"Artifact purpose","approach":"Predictive","type":"matching","stem":"During a predictive facility upgrade, a new project coordinator mixes several documents in one tracker. The project manager wants each record to support the decision it was designed for and retain useful traceability. Match each information need to the MOST appropriate artifact.","options":["Schedule baseline","Procurement performance record","Requirements traceability matrix","Issue log"],"prompts":["Compare approved milestone dates with current forecasts.","Connect a customer requirement to its acceptance test.","Review whether a supplier met delivery obligations.","Track a current installation blocker and its owner."]},{"id":"PR21","domain":"Process","task":7,"topic":"Cost of quality","approach":"Predictive","type":"single","stem":"A precision-parts project spends increasing amounts on scrap and customer returns. An engineer proposes automated setup checks that add a small recurring production cost but catch incorrect settings before machining begins. What should the project manager use to evaluate the proposal?","options":["Compare prevention and appraisal investment with avoidable internal and external failure costs.","Reject the proposal because it raises the cost of each production run.","Approve the proposal solely because automation always improves product quality.","Compare the setup-check cost only with the final inspection labor budget."]},{"id":"PR27","domain":"Process","task":5,"topic":"Procurement evaluation","approach":"Predictive","type":"multiple","stem":"A project is buying specialized pumps. The lowest-priced bid excludes required commissioning, while a higher-priced bid includes commissioning and better documented maintenance support. The team has approved evaluation criteria covering lifecycle cost and technical compliance. What should it do? Select TWO.","options":["Add a new preference for the favored supplier after viewing the bids.","Evaluate bids consistently against the approved criteria, including exclusions.","Compare lifecycle costs using a common scope and documented assumptions.","Select the lowest purchase price and negotiate the missing services afterward."]},{"task":4,"topic":"Opposition assessment","approach":"Hybrid","stem":"A department head opposes an automation release, citing loss of local flexibility. Other leaders describe the opposition as political and suggest reducing his involvement. His team owns an essential operational handoff. What should the project manager do before changing the engagement strategy?","options":["Ask the sponsor to publicly reaffirm that automation is mandatory.","Remove the department head from design sessions while keeping him informed.","Record his opposition as a risk and wait for operational testing.","Explore underlying concerns and assess legitimate impacts on his team's work."],"id":"PE47","domain":"People","type":"single"},{"task":8,"topic":"Bad-news communication","approach":"Predictive","stem":"A supplier reports a probable component delay, but the exact duration will not be known for four days. The customer is making staffing commitments tomorrow based on the delivery date. What should the project manager communicate now to best support the customer?","options":["Wait until a confirmed revised date avoids unnecessary alarm.","State that delivery remains unchanged because no formal notice exists.","Explain uncertainty, likely decision impact, and timing of the next update.","Forward the supplier's unedited email to every project stakeholder."],"id":"PE19","domain":"People","type":"single"},{"id":"BE35","domain":"Business Environment","task":6,"topic":"Sustainable performance improvement","approach":"Agile","type":"single","stem":"A software team's throughput increased after it began releasing late at night, but support incidents and staff fatigue also increased. Leaders want to standardize the new approach because delivery counts look better. What should the project manager recommend NEXT before adopting the practice widely?","options":["Evaluate end-to-end outcomes and costs with the team, then test improvements that preserve quality and sustainable capacity.","Extend the late-release pilot to more teams to confirm whether the throughput gain is consistent across the organization.","Assign extra support staff to release nights and retain the current approach until the delivery target has been achieved.","Introduce compensatory time off after each late release and recommend standardization once the team accepts that arrangement."]},{"id":"PR19","domain":"Process","task":4,"topic":"Resource leveling","approach":"Predictive","type":"single","stem":"Two critical installation activities require the same crane on the same morning. Renting a second crane is impossible at this site, and their durations cannot be compressed. The published schedule assumed unlimited resources. What should the project manager do NEXT?","options":["Keep both activities scheduled and let the site supervisor choose daily priorities.","Divide each activity's estimated duration by the number of crews assigned.","Report both activities as started so the milestone report remains consistent.","Level the crane demand and recalculate the resulting completion forecast."]},{"task":3,"topic":"Self-organizing delivery","approach":"Agile","stem":"A team asks the project manager to assign every sprint task because its previous manager did so. Team members have the necessary skills but little experience making collective commitments. Which TWO actions best support a transition toward greater ownership? Select TWO.","options":["Maintain individual assignments indefinitely to avoid delivery uncertainty.","Facilitate team planning and coach members to select work together.","Remove all delivery goals so the team discovers its own direction.","Agree goals and boundaries while progressively transferring task decisions to the team."],"id":"PE30","domain":"People","type":"multiple"},{"id":"BE22","domain":"Business Environment","task":1,"topic":"Adaptive governance","approach":"Agile","type":"multiple","stem":"An agile product team operates in a regulated organization. Weekly steering reviews duplicate backlog decisions and slow learning, while auditors need clear evidence of release authorization. Which TWO changes best tailor governance without losing necessary accountability? Select TWO.","options":["Give the product owner explicit prioritization authority within agreed funding, risk, and compliance boundaries.","Remove release approval records because agile transparency makes documented authorization unnecessary.","Define exception triggers and provide lightweight evidence focused on outcomes and required release controls.","Require the steering committee to approve every task estimate before work begins in each iteration."]},{"task":6,"topic":"Unrequested feature promise","approach":"Agile","stem":"During a customer call, an engineer enthusiastically says a requested analytics feature should be easy to deliver next month. The product owner has not assessed it, and other commitments consume current capacity. What should the project manager encourage as the next step?","options":["Treat the statement as a commitment and move existing work aside.","Clarify the statement with the customer and route the request through prioritization.","Ask the engineer to implement the feature outside normal team planning.","Wait until next month to explain whether the feature made the release."],"id":"PE41","domain":"People","type":"single"},{"id":"BE11","domain":"Business Environment","task":8,"topic":"External policy impact","approach":"Predictive","type":"single","stem":"A government announces a proposed import tariff affecting equipment for a project that has not yet placed its largest order. The policy is not final, and cancelling procurement would threaten the completion date. What should the project manager do FIRST?","options":["Evaluate exposure and plausible scenarios with procurement, then update risks and decision triggers.","Ask procurement to negotiate an accelerated purchase option before quantifying tariff exposure across the orders.","Ask the sponsor to authorize a tariff contingency based on the full value of the proposed equipment order.","Delay the affected order until the policy is confirmed and request a corresponding milestone extension."]},{"task":3,"topic":"Coaching a new lead","approach":"Predictive","stem":"A technically strong engineer has become a work-package lead. Her reports are accurate, but she personally rechecks every task and the team increasingly waits for her approval. No safety rule requires these additional checks. What is the project manager's best response?","options":["Add review time to the schedule so her preferred approach remains sustainable.","Coach her on delegation and agree clear decision boundaries with the team.","Transfer approval responsibility to the project manager to remove her bottleneck.","Ask the team to bypass her whenever a scheduled task is ready."],"id":"PE06","domain":"People","type":"single"},{"id":"PR71","domain":"Process","task":5,"topic":"Supplier knowledge deliverables","approach":"Agile","type":"single","stem":"An agile team buys an external component that works in the vendor's environment but is difficult to maintain internally. The agreement includes deployment scripts and knowledge transfer, neither of which has been delivered. The vendor asks to close the engagement. What should the project manager do NEXT?","options":["Have internal staff recreate the scripts without recording the missing vendor obligations.","Declare the knowledge transfer unnecessary because the vendor can be contacted later.","Assess and complete the outstanding contractual deliverables before final acceptance.","Accept the engagement because the executable component functions at the vendor site."]},{"task":1,"topic":"Sustainability vision","approach":"Hybrid","stem":"A retail modernization project promises lower energy use and faster checkout. Teams interpret sustainability as an optional reporting activity and prioritize only checkout speed. The sponsor considers both benefits essential. What should the project manager do to strengthen a common project vision?","options":["Agree measurable sustainability and service outcomes that guide prioritization.","Ask the sustainability department to report energy savings after closure.","Let each team decide whether energy performance fits local objectives.","Make energy reduction the sole objective until the misunderstanding is corrected."],"id":"PE36","domain":"People","type":"single"},{"task":5,"topic":"Team role alignment","approach":"Predictive","stem":"A project uses specialists from three departments. Two work packages remain unassigned because each department assumes another owns integration testing. The schedule baseline shows testing dates but no accountable lead. What should the project manager do to prevent further ambiguity?","options":["Assign both packages to whichever department has spare capacity.","Let specialists negotiate ownership when the testing window begins.","Escalate the missed assignments without changing responsibility documentation.","Facilitate agreement on responsibilities and update the responsibility assignments."],"id":"PE16","domain":"People","type":"single"},{"task":1,"topic":"Product vision renewal","approach":"Agile","stem":"A digital-services team completes many stories, but developers cannot explain which customer problem the current release addresses. The product owner has been accepting requests from several executives as they arrive. What should the project manager encourage the team and product owner to do first?","options":["Increase story-point targets so the team can satisfy more executives.","Revisit the product vision and connect upcoming priorities to a clear customer outcome.","Finish the current backlog before revisiting the direction of the product.","Let developers choose the most technically interesting requests for the next iteration."],"id":"PE28","domain":"People","type":"single"},{"task":2,"topic":"Conflict response matching","approach":"Predictive","type":"matching","stem":"A project manager is choosing responses to three distinct disagreements during a factory upgrade. All parties remain willing to work together, and no emergency threatens safety. Match each situation with the most appropriate initial response, considering the interests and authority involved.","prompts":["Two engineers disagree about sequence and have not compared dependency data.","A disagreement concerns whether a permit condition allows an activity.","A team member reports repeated interruptions during technical discussions."],"options":["Clarify the condition with the authorized compliance specialist.","Discuss the behavior privately and reinforce agreed participation norms.","Facilitate joint analysis of dependencies and alternatives."],"id":"PE12","domain":"People"},{"id":"PR15","domain":"Process","task":1,"topic":"Integrated dependency analysis","approach":"Predictive","type":"single","stem":"An industrial installation has separately approved electrical, mechanical, and training plans. Each plan meets its own milestone, yet the combined schedule begins operator training before the equipment is safe to energize. What should the project manager do FIRST to correct the planning problem?","options":["Ask the training manager to report progress more frequently.","Reconcile cross-plan dependencies and establish an integrated sequence.","Shorten the electrical team's work to preserve the published training date.","Treat each approved subplan as independent until installation begins."]},{"task":8,"topic":"Communication effectiveness","approach":"Predictive","stem":"A project dashboard shows all work packages as green because actual cost is below budget. Several tasks are late, and the sponsor interprets green as confirmation that the launch remains secure. The data itself is accurate. What should the project manager change?","options":["Retain the dashboard and ask the sponsor to read the schedule separately.","Remove colors so stakeholders cannot draw an unintended conclusion.","Clarify indicator definitions and show schedule and forecast impacts alongside cost.","Report only overdue tasks until the sponsor understands the schedule risk."],"id":"PE25","domain":"People","type":"single"},{"id":"PR17","domain":"Process","task":2,"topic":"Acceptance traceability","approach":"Predictive","type":"multiple","stem":"A water-treatment upgrade has many technical deliverables and several customer departments. Near acceptance, some requirements have test evidence but no named acceptance authority; others have an owner but no verification method. What should the project manager establish to prevent this problem on the next phase? Select TWO.","options":["Use the contractor's invoice as the primary proof of scope completion.","Trace each agreed requirement to its deliverable and verification evidence.","Obtain agreement on acceptance criteria and accountable acceptance authorities.","Ask the sponsor to approve every test result on behalf of all departments."]},{"id":"PR29","domain":"Process","task":8,"topic":"Three-point estimating","approach":"Predictive","type":"single","stem":"A restoration project is estimating an unfamiliar inspection activity. Experts provide optimistic, most likely, and pessimistic durations and agree to use the PERT weighted average for the initial schedule model. Based on the table, what expected duration should the project manager use?","options":["12 days.","14 days.","10 days.","11 days."],"table":{"headers":["Estimate","Duration"],"rows":[["Optimistic","6 days"],["Most likely","10 days"],["Pessimistic","20 days"]]}},{"id":"BE31","domain":"Business Environment","task":1,"topic":"Decision transparency","approach":"Hybrid","type":"single","stem":"A hybrid project steering group selects a release option that meets the funding limit but delays an important accessibility improvement. Several team members were absent and later question why the improvement was deferred. What should the project manager do to BEST sustain transparent governance?","options":["Explain that steering decisions are confidential and need no rationale once formally approved.","Reopen the decision immediately whenever any team member disagrees with the selected option.","Share the authorized decision record, assessed trade-offs, accountable owner, and conditions for reconsideration.","Tell the team that accessibility is outside its concern because the funding decision belongs to executives."]},{"id":"BE41","domain":"Business Environment","task":3,"topic":"Benefit trade-off change","approach":"Hybrid","type":"single","stem":"A hybrid project can meet its original launch date by dropping multilingual support, but the business case assumes expansion into two additional language markets. The sponsor asks the team to decide quickly because schedule confidence is deteriorating. What should the project manager do FIRST?","options":["Drop the support because schedule is the only benefit that can be measured before launch.","Keep all scope unchanged and instruct the team to recover the schedule through additional effort.","Analyze the benefit, stakeholder, cost, and schedule consequences of feasible options for the authorized decision maker.","Let each development team independently remove the language functions that require the most remaining effort."]},{"task":7,"topic":"AI knowledge quality","approach":"Hybrid","stem":"A team proposes using an AI assistant to draft operational guides from project conversations. The draft appears polished, but reviewers find it combines superseded decisions with current procedures. What should the project manager establish before the guides are used for knowledge transfer?","options":["A disclaimer making users responsible for identifying inaccurate steps.","Automatic publication after processing the latest meeting notes.","Source checks and validation of procedures by accountable subject experts.","A requirement that readers compare guides with every original conversation."],"id":"PE50","domain":"People","type":"single"},{"id":"PR06","domain":"Process","task":2,"topic":"Scope baseline","approach":"Predictive","type":"single","stem":"An equipment installation project has an approved scope statement and schedule. Two subcontractors interpret responsibility for commissioning differently, and each assumed the other would supply test records. The project manager discovers that work packages have names but no detailed descriptions. What would BEST prevent this ambiguity?","options":["A requirement that the sponsor approve every subcontractor task assignment.","A more frequent status meeting with both subcontractors.","A work breakdown structure dictionary defining work-package boundaries and acceptance.","A schedule buffer assigned to every commissioning activity."]},{"id":"BE23","domain":"Business Environment","task":3,"topic":"Backlog change boundaries","approach":"Agile","type":"single","stem":"A product owner wants to replace a low-value feature with a customer-requested enhancement before the next iteration. The change fits the approved product objective, budget, and compliance boundaries, and the team has not committed to the iteration. What should the project manager support?","options":["Submit every backlog substitution to the investment board regardless of established delegated authority.","Let the product owner refine priorities with the team and stakeholders using expected value and dependencies.","Freeze the backlog until the original release list is complete to protect the scope baseline.","Ask developers to implement both features so no stakeholder has to accept a prioritization trade-off."]},{"id":"PR45","domain":"Process","task":3,"topic":"Minimum viable outcome","approach":"Agile","type":"single","stem":"An agile team can release a simple invoice-matching workflow in one month or a sophisticated dashboard in three months. Users' main problem is time spent manually reconciling invoices, and both options fit the agreed product direction. What should the project manager encourage the product owner to do FIRST?","options":["Ask developers to select whichever option uses newer technology.","Commit to both options before assessing available capacity or value.","Choose the dashboard because a larger release will appear more complete.","Evaluate the smaller workflow against the user outcome and learning it enables."]},{"id":"PR35","domain":"Process","task":1,"topic":"Tailoring delivery approach","approach":"Hybrid","type":"single","stem":"A product team is replacing a stable payroll calculation engine while exploring an employee self-service experience that users cannot yet specify. Payroll certification has fixed evidence requirements, and user feedback can be obtained every fortnight. Which delivery approach BEST fits this combination?","options":["Combine planned certification milestones with iterative discovery and delivery of the interface.","Use an unrestricted backlog for all certification obligations without planned evidence dates.","Run independent projects and integrate payroll with the interface only at final release.","Use detailed sequential planning for every interface decision before any feedback."]},{"task":2,"topic":"Retrospective conflict","approach":"Agile","stem":"During a retrospective, a tester says developers hand over work too late. A developer replies that testers always change expectations. Both cite recent examples, and the discussion becomes defensive. What should the facilitator do next to help the team improve its working relationship?","options":["Close the discussion and choose an improvement on the team's behalf.","Ask each function to hold a separate retrospective and submit recommendations.","Refocus on a shared example, explore the workflow, and agree one joint experiment.","Require the tester to express the concern in writing before discussing it further."],"id":"PE29","domain":"People","type":"single"},{"id":"BE28","domain":"Business Environment","task":7,"topic":"Local change champions","approach":"Hybrid","type":"single","stem":"A hybrid analytics rollout receives strong executive support but limited use in regional offices. Interviews reveal that local managers distrust standardized reports because they do not reflect regional exceptions. What should the project manager do NEXT to improve adoption and preserve a common reporting objective?","options":["Require daily usage reports and escalate every manager who continues using a local spreadsheet.","Replace the enterprise reporting objective with separate regional products to eliminate disagreement.","Deliver the original executive presentation again to reinforce the importance of centralized reporting.","Engage regional representatives to validate concerns, shape workable practices, and champion agreed changes locally."]},{"id":"BE34","domain":"Business Environment","task":4,"topic":"Issue impact prioritization","approach":"Agile","type":"single","stem":"Two issues compete for an agile team's immediate attention: a dashboard access defect delays a major client's monthly reporting, and an intermittent synchronization defect can duplicate customer refunds. Capacity allows only one fix today. What should the project manager facilitate FIRST to select the response?","options":["Ask the product owner to use current client revenue to determine which affected customer group receives the first fix.","Ask developers to estimate both fixes and prioritize the shorter repair to restore the greatest delivery throughput.","Escalate both issues to the sponsor for a funding decision before discussing temporary workarounds with the team.","Assess urgency, customer harm, financial exposure, and available containment against agreed prioritization criteria."]},{"id":"BE24","domain":"Business Environment","task":2,"topic":"Incremental compliance","approach":"Agile","type":"single","stem":"A software team plans monthly releases for a payment service. Compliance specialists usually review only the final release, and earlier projects discovered expensive control gaps late. Which action would BEST prevent the same pattern while preserving incremental delivery and the specialists' limited availability?","options":["Schedule the specialists only for the last release because earlier increments are too incomplete to assess.","Allow developers to decide which payment obligations are optional when they conflict with iteration capacity.","Pause all implementation until every possible future compliance scenario has been fully documented.","Involve specialists in defining testable controls and evidence, then verify relevant requirements within increments."]},{"id":"PR28","domain":"Process","task":2,"topic":"Product versus project scope","approach":"Predictive","type":"single","stem":"A factory automation project has a signed product specification listing machine speeds and tolerances. The schedule omits operator training and migration of operating procedures because those are not machine features. What should the project manager do FIRST to resolve the gap?","options":["Add machine features of equal cost so the approved budget remains fully used.","Confirm the work required to deliver and transition the agreed capability.","Remove training from all planning documents to match the product specification.","Ask operations to absorb the omitted work without discussing acceptance."]},{"id":"PR33","domain":"Process","task":9,"topic":"Configuration traceability","approach":"Predictive","type":"single","stem":"An installation team uses a drawing downloaded last month, while inspectors use the current approved revision. Both teams believe their copy is authoritative, and the discrepancy has caused rework. What should the project manager establish to BEST prevent recurrence?","options":["A separate drawing archive for each discipline without shared revision references.","A controlled repository with revision identification, access rules, and obsolete-copy handling.","A weekly email asking everyone to remember which drawing is current.","A requirement that inspectors accept whichever revision the installer used."]},{"id":"PR05","domain":"Process","task":1,"topic":"Rolling-wave planning","approach":"Predictive","type":"single","stem":"A bridge inspection program has approved funding and defined the first inspection package in detail. Later packages depend on findings from the initial surveys, and the sponsor still needs a credible overall milestone plan. What planning approach should the project manager recommend?","options":["Delay the integrated plan until every inspection finding is available.","Detail all later tasks using assumptions and treat those estimates as fixed.","Plan near-term packages in detail and progressively elaborate later packages.","Authorize the first package without showing its links to subsequent milestones."]},{"id":"BE29","domain":"Business Environment","task":8,"topic":"Sustainability expectations","approach":"Hybrid","type":"single","stem":"A retailer's digital fulfillment project uses an approved cost-saving business case. Midway through delivery, the organization adopts a public emissions target that materially affects transportation choices. No project-specific target has been assigned yet. What is the project manager's BEST first action?","options":["Assess alignment and delivery impacts with business owners, then recommend measurable objectives or authorized changes.","Ask transport suppliers for low-emission alternatives and submit the least expensive offer as the project's strategic response.","Record the target as an external risk and wait for the portfolio office to assign a project-specific requirement.","Request a revised emissions
